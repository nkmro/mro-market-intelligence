<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRO 자재 시황 관리 시스템 - 로그인</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a6b52">
<style>
  :root {
    --accent: #1a6b52;
    --accent-dark: #0f4a38;
    --bg: #f6f5f2;
    --card: #ffffff;
    --border: #e2e0da;
    --text: #1f2320;
    --text-muted: #6b6f6a;
    --danger: #b3413a;
    --danger-bg: #fbeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
  }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand-title { font-size: 16px; font-weight: 600; }
  .brand-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tabs {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
  }
  .tab.active { background: var(--bg); color: var(--text); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  button.primary {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 44px;
    margin-top: 18px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { cursor: not-allowed; }
  .btn-load-base, .btn-load-fill {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 14px;
  }
  button.loading .btn-label { display: none; }
  button.loading .btn-load-base,
  button.loading .btn-load-fill { display: flex; }
  .btn-load-base { background: #7c88a3; color: rgba(255,255,255,.5); }
  .btn-load-fill {
    background: #26418f;
    color: #fff;
    clip-path: inset(0 100% 0 0);
  }
  .link-row { text-align: right; margin-top: 6px; }
  .link-row.center { text-align: center; margin-top: 14px; }
  a.link { font-size: 12px; color: var(--accent); text-decoration: none; cursor: pointer; }
  .error-box {
    display: none;
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 12px;
  }
  .info-box {
    background: var(--bg);
    color: var(--text-muted);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .pane { display: none; }
  .pane.active { display: block; }
  .success-screen { text-align: center; }
  .success-screen .icon { font-size: 40px; margin-bottom: 8px; }
  .success-screen .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .success-screen .role { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="ios-install-overlay" id="ios-install-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:100; padding:20px; box-sizing:border-box;">
  <div style="background:white; max-width:320px; width:100%; border-radius:16px; padding:24px 20px; text-align:center;">
    <div style="font-size:16px; font-weight:500; margin-bottom:8px;">홈 화면에 추가하기</div>
    <div style="font-size:13px; color:#6b6a66; line-height:1.6; margin-bottom:16px;">
      1. 하단 공유 버튼(<span style="font-weight:500;">□↑</span>)을 눌러주세요<br>
      2. "홈 화면에 추가"를 선택해주세요<br>
      3. 오른쪽 위 "추가"를 눌러주세요
    </div>
    <button onclick="document.getElementById('ios-install-overlay').style.display='none';" style="width:100%; background:#1a6b52; color:white; border:none; border-radius:8px; padding:10px; font-size:14px; cursor:pointer;">확인했어요</button>
  </div>
</div>

<div class="install-prompt-wrap" id="install-prompt-wrap" style="max-width:380px; margin:0 auto 12px; text-align:center; font-size:13px; color:#6b6a66; line-height:1.5; display:none;">
  첫 방문이시면, <a href="#" id="install-app-link" style="color:#1a6b52; text-decoration:underline; font-weight:700;">앱 바로가기 설치</a>를 권장해요
</div>

<div class="card" style="display:none;">
  <div class="brand">
    <div class="brand-title">MRO 자재 시황</div>
    <div class="brand-sub">AI 기반 원자재 뉴스 모니터링 시스템</div>
  </div>

  <div id="auth-area">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="showTab('login')">로그인</button>
      <button class="tab" id="tab-signup" onclick="showTab('signup')">회원가입</button>
      <button class="tab" id="tab-reset" onclick="showTab('reset')" style="display:none;">비밀번호 찾기</button>
    </div>

    <!-- 로그인 -->
    <div class="pane active" id="pane-login">
      <div style="display:flex; align-items:center; justify-content:space-between;">
      <label for="login-email" style="margin:10px 0 4px;">이메일</label>
      <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-muted, #888); font-weight:400; cursor:pointer; margin:0;"><input type="checkbox" id="remember-email" checked style="width:13px; height:13px;">이메일 저장</label>
      </div>

      <label for="login-password">비밀번호</label>

      <button class="primary" id="btn-login" onclick="doLogin()"><span class="btn-label">로그인</span><span class="btn-load-base">NKMRO</span><span class="btn-load-fill">NKMRO</span></button>
<label style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; color:var(--text-muted, #888);"><input type="checkbox" id="notif-optin" checked style="width:15px; height:15px;">브라우저 알림 받기</label>

    <div class="pane" id="pane-signup">

        <select id="signup-team">

        <button class="primary" id="btn-signup-request" onclick="doRequestSignup()"><span class="btn-label">인증코드 받기</span><span class="btn-load-base">NKMRO</span><span class="btn-load-fill">NKMRO</span></button>

        <div class="error-box" id="signup-verify-error"></div>

        <input type="email" id="reset-email" placeholder="name@nkmro.com">
        <button class="primary" id="btn-reset-request" onclick="doRequestReset()"><span class="btn-label">인증코드 받기</span><span class="btn-load-base">NKMRO</span><span class="btn-load-fill">NKMRO</span></button>
        <div class="error-box" id="reset-error"></div>
      </div>
      <div id="reset-step2" style="display:none;">

        <input type="password" id="reset-newpassword" placeholder="6자 이상">
        <button class="primary" id="btn-reset-confirm" onclick="doConfirmReset()"><span class="btn-label">비밀번호 변경</span><span class="btn-load-base">NKMRO</span><span class="btn-load-fill">NKMRO</span></button>

  <!-- 로그인 성공 (임시 - 피드 화면 개발 전까지) -->

    <div class="name" id="success-name"></div>

    <div class="link-row center"><a class="link" onclick="doLogout()">로그아웃</a></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby8ah2Ny5xtp0TMJd093KEsnNZkCItIOsHCoRNFdoOyjnUw4brP7vc28PAeccJms0rh/exec';

// 로그인진단로그에 접속 기기 종류(iOS/Android/Windows/Mac 등)를 남기기 위한 판별 함수.
// navigator.userAgentData(최신 표준)는 사파리/파이어폭스가 지원을 안 해서 iOS 전체가 빠지므로
// 쓰지 않고, 기존 isIOS 판별과 같은 방식으로 navigator.userAgent 문자열을 그대로 사용한다.
function detectPlatform() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) return 'iOS';
  if (/Android/.test(ua)) return 'Android';
  if (/Windows/.test(ua)) return 'Windows';
  if (/Macintosh|Mac OS X/.test(ua)) return 'Mac';
  if (/Linux/.test(ua)) return 'Linux';
  return 'Other';
}

// 무활동 로그아웃 판정을 feed.html과 동일한 기준으로 여기서도 사용한다 (앱이 완전히 재시작되면
// index.html이 먼저 실행되어, 기존 세션으로 feed.html로 바로 넘길지 여부를 결정하기 때문).
// 서버 설정을 못 읽어왔을 때 쓰는 안전한 기본값 - 실제 운영 설정값과 같게 맞춰둔다.
const IDLE_TIMEOUT_FALLBACK_MINUTES = 600;
function getEffectiveIdleTimeoutMinutes() {
  const cached = Number(localStorage.getItem('mro_idle_timeout_minutes'));
  return cached > 0 ? cached : IDLE_TIMEOUT_FALLBACK_MINUTES;
}
function isIdleTimedOut() {
  const lastActivityRaw = localStorage.getItem('mro_last_activity');
  if (!lastActivityRaw) return false;
  const elapsedMs = Date.now() - Number(lastActivityRaw);
  return elapsedMs > getEffectiveIdleTimeoutMinutes() * 60 * 1000;
}

  function teamLabel(team) {
    return team === '본사' ? team : (team + '팀');
  }

  async function loadTeamOptions() {
    const sel = document.getElementById('signup-team');
    if (!sel) return;
    const fallback = ['동부', '서부', '중부', '영업지원'];
    try {
      const res = await callApi('getTeams', {});
      const teams = (res.ok && res.teams && res.teams.length) ? res.teams : fallback;
      sel.innerHTML = teams.map(t => '<option value="' + t + '">' + teamLabel(t) + '</option>').join('');
    } catch (e) {
      sel.innerHTML = fallback.map(t => '<option value="' + t + '">' + teamLabel(t) + '</option>').join('');
    }
  }
  loadTeamOptions();

const ERROR_MESSAGES = {
  MISSING_FIELDS: '입력하지 않은 항목이 있어요.',
  USER_NOT_FOUND: '등록되지 않은 이메일이에요.',
  USER_INACTIVE: '비활성화된 계정이에요. 팀장님께 문의해주세요.',
  ACCOUNT_LOCKED: '로그인 5회 실패로 계정이 잠겼어요. 비밀번호를 재설정해주세요.',
  WRONG_PASSWORD: '비밀번호가 일치하지 않아요.',
  INVALID_DOMAIN: '@nkmro.com 이메일만 가입할 수 있어요.',
  PASSWORD_TOO_SHORT: '비밀번호는 6자 이상이어야 해요.',
  ALREADY_REGISTERED: '이미 가입된 이메일이에요.',
  CODE_EXPIRED_OR_NOT_FOUND: '인증코드가 만료됐어요. 다시 요청해주세요.',
  CODE_MISMATCH: '인증코드가 일치하지 않아요.',
  CODE_MISMATCH_OR_EXPIRED: '인증코드가 일치하지 않거나 만료됐어요.',
  SERVER_ERROR: '일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.',
    TOO_MANY_ATTEMPTS: '시도 횟수를 초과했어요. 인증코드를 다시 요청해주세요.',
    TOO_MANY_REQUESTS: '너무 많이 요청하셨어요. 1시간 후 다시 시도해주세요.'
};

function errMsg(code, res) {
    if ((code === 'CODE_MISMATCH' || code === 'CODE_MISMATCH_OR_EXPIRED') && res && typeof res.remainingAttempts === 'number') {
          return '인증코드가 일치하지 않아요. (5회 중 ' + res.remainingAttempts + '회 남았습니다!)';
    }
    return ERROR_MESSAGES[code] || ('오류가 발생했어요 (' + code + ')');
}

async function callApi(action, body) {
  // 응답이 아예 안 오고 멈추는 경우(콜드 스타트/네트워크 지연 등)를 대비해 일정 시간 후 강제로
  // 요청을 중단시킨다. 이렇게 abort되면 fetch가 예외를 던지고, 그 예외는 각 호출부(doLogin 등)의
  // catch(e)로 이어져 기존 재시도/에러 표시 로직이 정상적으로 작동한다.
  const controller = new AbortController();
  const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action }, body)),
      signal: controller.signal
    });
    return await res.json();
  } finally {
    clearTimeout(timeoutId);
  }
}

function showTab(name) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + name);
  if (tab) tab.classList.add('active');
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(elId) {
  document.getElementById(elId).style.display = 'none';
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? '처리 중...' : label;
}

function startLoadingFill(btnId) {
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.classList.add('loading');
  const fill = btn.querySelector('.btn-load-fill');
  fill.style.transition = 'none';
  fill.style.clipPath = 'inset(0 100% 0 0)';
  btn._loadCancelled = false;
  const start = performance.now();
  function step(ts) {
    if (btn._loadCancelled) return;
    const elapsed = ts - start;
    const pct = 88 * (1 - Math.exp(-elapsed / 900));
    fill.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
    btn._raf = requestAnimationFrame(step);
  }
  btn._raf = requestAnimationFrame(step);
}

function finishLoadingFill(btnId) {
  return new Promise(resolve => {
    const btn = document.getElementById(btnId);
    btn._loadCancelled = true;
    if (btn._raf) cancelAnimationFrame(btn._raf);
    const fill = btn.querySelector('.btn-load-fill');
    fill.style.transition = 'clip-path .25s ease-out';
    fill.style.clipPath = 'inset(0 0% 0 0)';
    setTimeout(resolve, 260);
  });
}

function cancelLoadingFill(btnId) {
  const btn = document.getElementById(btnId);
  btn._loadCancelled = true;
  if (btn._raf) cancelAnimationFrame(btn._raf);
  btn.disabled = false;
  btn.classList.remove('loading');
  const fill = btn.querySelector('.btn-load-fill');
  fill.style.transition = 'none';
  fill.style.clipPath = 'inset(0 100% 0 0)';
}

async function doLogin(isRetry) {
  if (!isRetry) hideError('login-error');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!isRetry && (!email || !password)) { showError('login-error', ERROR_MESSAGES.MISSING_FIELDS); return; }

  if (!isRetry) {
    const rememberEmail = document.getElementById('remember-email');
    if (rememberEmail && rememberEmail.checked) {
      localStorage.setItem('mro_saved_email', email);
    } else {
      localStorage.removeItem('mro_saved_email');
    }
  }
  if (!isRetry) startLoadingFill('btn-login');
  try {
    const res = await callApi('login', { email, password, isRetry: !!isRetry, platform: detectPlatform() });
    if (!res.ok) { cancelLoadingFill('btn-login'); showError('login-error', errMsg(res.error)); return; }
    await finishLoadingFill('btn-login');
    saveSession(res);
    showSuccess(res);
  } catch (e) {
    // 앱스스크립트 웹앱이 간헐적으로 응답에 실패(콜드 스타트, 리다이렉트 중 POST->GET 전환 등)하는
    // 경우에 대비해 한번만 자동 재시도한다. catch(e)로 온다는 건 서버의 login 로직 자체가 실행되지
    // 않았다는 뜻이라(응답을 못 받았을 뿐 서버가 비밀번호를 검사하지도 않았음), 재시도해도 로그인
    // 실패 횟수(계정 잠금 카운터)가 중복으로 올라갈 위험이 없다.
    if (!isRetry) { setTimeout(function () { doLogin(true); }, 1500); return; }
    cancelLoadingFill('btn-login');
    showError('login-error', errMsg('SERVER_ERROR'));
  }
}

async function doRequestSignup() {
  hideError('signup-error');
  const email = document.getElementById('signup-email').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const team = document.getElementById('signup-team').value;
  const password = document.getElementById('signup-password').value;
  if (!email || !name || !password) { showError('signup-error', ERROR_MESSAGES.MISSING_FIELDS); return; }

  startLoadingFill('btn-signup-request');
  try {
    const res = await callApi('requestSignup', { email, name, team, password });
    if (!res.ok) { cancelLoadingFill('btn-signup-request'); showError('signup-error', errMsg(res.error)); return; }
    await finishLoadingFill('btn-signup-request');
    document.getElementById('signup-sent-to').textContent = email + ' 으로 인증코드를 보냈어요.';
    document.getElementById('signup-step1').style.display = 'none';
    document.getElementById('signup-step2').style.display = 'block';
  } catch (e) {
    cancelLoadingFill('btn-signup-request');
    showError('signup-error', errMsg('SERVER_ERROR'));
  }
}

async function doVerifySignup() {
  hideError('signup-verify-error');
  const email = document.getElementById('signup-email').value.trim();
  const code = document.getElementById('signup-code').value.trim();
  if (!code) { showError('signup-verify-error', ERROR_MESSAGES.MISSING_FIELDS); return; }

  startLoadingFill('btn-signup-verify');
  try {
    const res = await callApi('verifySignup', { email, code });
        if (!res.ok) { cancelLoadingFill('btn-signup-verify'); showError('signup-verify-error', errMsg(res.error, res)); return; }
    await finishLoadingFill('btn-signup-verify');
    document.getElementById('signup-password').value = document.getElementById('signup-password').value;
    showTab('login');
    document.getElementById('login-email').value = email;
    cancelLoadingFill('btn-signup-verify');
  } catch (e) {
    cancelLoadingFill('btn-signup-verify');
    showError('signup-verify-error', errMsg('SERVER_ERROR'));
  }
}

function backToSignupStep1() {
  document.getElementById('signup-step1').style.display = 'block';
  document.getElementById('signup-step2').style.display = 'none';
}

async function doRequestReset() {
  hideError('reset-error');
  const email = document.getElementById('reset-email').value.trim();
  if (!email) { showError('reset-error', ERROR_MESSAGES.MISSING_FIELDS); return; }

  startLoadingFill('btn-reset-request');
  try {
    const res = await callApi('requestPasswordReset', { email });
    if (!res.ok) { cancelLoadingFill('btn-reset-request'); showError('reset-error', errMsg(res.error)); return; }
    await finishLoadingFill('btn-reset-request');
    document.getElementById('reset-sent-to').textContent = email + ' 으로 인증코드를 보냈어요.';
    document.getElementById('reset-step1').style.display = 'none';
    document.getElementById('reset-step2').style.display = 'block';
    cancelLoadingFill('btn-reset-request');
  } catch (e) {
    cancelLoadingFill('btn-reset-request');
    showError('reset-error', errMsg('SERVER_ERROR'));
  }
}

async function doConfirmReset() {
  hideError('reset-confirm-error');
  const email = document.getElementById('reset-email').value.trim();
  const code = document.getElementById('reset-code').value.trim();
  const newPassword = document.getElementById('reset-newpassword').value;
  if (!code || !newPassword) { showError('reset-confirm-error', ERROR_MESSAGES.MISSING_FIELDS); return; }

  startLoadingFill('btn-reset-confirm');
  try {
    const res = await callApi('confirmPasswordReset', { email, code, newPassword });
        if (!res.ok) { cancelLoadingFill('btn-reset-confirm'); showError('reset-confirm-error', errMsg(res.error, res)); return; }
    await finishLoadingFill('btn-reset-confirm');
    showTab('login');
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = '';
    cancelLoadingFill('btn-reset-confirm');
  } catch (e) {
    cancelLoadingFill('btn-reset-confirm');
    showError('reset-confirm-error', errMsg('SERVER_ERROR'));
  }
}

function saveSession(res) {
  localStorage.setItem('mro_session', JSON.stringify({
    sessionToken: res.sessionToken,
    email: res.email,
    name: res.name,
    role: res.role,
    team: res.team,
    passwordExpired: res.passwordExpired || false
  }));
  // 방금 실제로 로그인에 성공한 경우에만 세워지는 표시. feed.html이 이 표시를 보고
  // "새로 로그인한 것"과 "기존 세션으로 앱이 재시작된 것"을 구분해 뉴스 수집 애니메이션을
  // 새 로그인일 때만 보여준다. sessionStorage라서 앱이 완전히 재시작되면 자동으로 사라진다.
  sessionStorage.setItem('mro_fresh_login', '1');
  localStorage.setItem('mro_last_activity', String(Date.now()));
}

async function showSuccess(res) {
  const optIn = document.getElementById('notif-optin');
  if (optIn && optIn.checked && typeof Notification !== 'undefined' && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (e) {}
  }
  window.location.href = 'feed.html';
}

function doLogout() {
  localStorage.removeItem('mro_session');
  localStorage.removeItem('mro_last_activity');
  document.getElementById('auth-area').style.display = 'block';
  document.getElementById('pane-success').classList.remove('active');
  showTab('login');
}

(function initRememberEmail() {
  const checkbox = document.getElementById('remember-email');
  const emailInput = document.getElementById('login-email');
  if (!checkbox || !emailInput) return;
  const rememberSetting = localStorage.getItem('mro_remember_email');
  const savedEmail = localStorage.getItem('mro_saved_email');
  checkbox.checked = rememberSetting === null ? true : rememberSetting === '1';
  if (checkbox.checked && savedEmail) {
    emailInput.value = savedEmail;
  }
  checkbox.addEventListener('change', function () {
    localStorage.setItem('mro_remember_email', checkbox.checked ? '1' : '0');
    if (!checkbox.checked) {
      localStorage.removeItem('mro_saved_email');
    } else if (emailInput.value.trim()) {
      localStorage.setItem('mro_saved_email', emailInput.value.trim());
    }
  });
})();

// 로그인 화면(.card)은 기본적으로 숨겨둔다(HTML에 style="display:none"). 세션 유무를 판정하기
// 전까지는 화면에 아무것도 보여주지 않고, 정말로 로그인 화면을 보여줘야 하는 경우(세션이 없거나
// 무활동 시간이 초과된 경우)에만 여기서 명시적으로 다시 보여준다 - 유효한 세션으로 feed.html로
// 바로 넘어가는 경우에 로그인 폼이 잠깐 화면에 찍혔다가 사라지는 현상을 막기 위함.
function showLoginCard() {
  const card = document.querySelector('.card');
  if (card) card.style.display = 'block';
}

(function init() {
  const saved = localStorage.getItem('mro_session');
  if (!saved) { showLoginCard(); return; }
  try {
    const session = JSON.parse(saved);
    // 앱이 완전히 재시작된 경우(백그라운드 종료 후 재실행 등) 이 화면이 먼저 실행된다.
    // 무활동 시간을 이미 초과했다면 feed.html로 넘기지 않고, 여기서 곧바로 세션을 정리해
    // 로그인 화면을 그대로 보여준다 (수집 애니메이션 등 어떤 화면도 거치지 않음).
    if (isIdleTimedOut()) {
      localStorage.removeItem('mro_session');
      localStorage.removeItem('mro_last_activity');
      showLoginCard();
      return;
    }
    showSuccess(session);
  } catch (e) { localStorage.removeItem('mro_session'); showLoginCard(); }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}

(function () {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const wrap = document.getElementById('install-prompt-wrap');
  const link = document.getElementById('install-app-link');
  if (isStandalone || !wrap) return;
  wrap.style.display = 'block';

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    wrap.style.display = 'block';
  });

  if (isIOS) {
    wrap.style.display = 'block';
  }

  link.addEventListener('click', function (e) {
    e.preventDefault();
    if (isIOS) {
      document.getElementById('ios-install-overlay').style.display = 'flex';
      return;
    }
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
      });
    }
  });
})();
</script>
