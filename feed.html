<!-- [DELIVERY] 이 파일은 GitHub feed.html 전체 교체용입니다 (설정 화면에 '시황 게시 최소 점수' 항목 설명 추가, 2026-10-19) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRO 워크허브</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a2f6e">
<style>
  /* [2026-09-29] 모바일 터치 오조작·화면 확대 방지 (index.html / feed.html 공통)
     - 입력칸 터치 시 화면이 당겨지는(자동 확대) 현상: iOS는 입력칸 글자가 16px보다 작으면
       포커스 때 자동 확대한다 → 터치 기기에서만 입력칸 글자를 16px로 맞추고, viewport에
       maximum-scale=1 을 지정해 이중으로 막는다.
     - 두 번 탭 확대 방지: touch-action: manipulation
     - 탭할 때 회색 번쩍임 / 버튼 길게 눌러 글자 선택·복사 메뉴 뜨는 것 방지 */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
  * { -webkit-tap-highlight-color: transparent; }
  button, a, label, .tab, .nav-item { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  @media (pointer: coarse) {
    input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px !important; }
  }
  :root {
    --accent: #3a2f6e;
    --accent-dark: #241c4a;
    --accent-soft: #f2eaf6;
    /* 2026-09-14: 재홍님 요청 - 이슈 댓글(#pinned-area)이 "전체 확인완료" 게시물 카드(--accent-soft)와
       배경색이 똑같아 헷갈린다는 피드백에 따라, 이슈 댓글 전용 옅은 붉은 계열을 추가했다. 새 색을
       만드는 대신 기존 --danger를 옅게 희석해 팔레트 일관성을 유지한다. */
    --danger-soft: #f6e2de;
    --sidebar-bg-end: #4d3f8f;
    --sidebar-lower: #bfb8d6;
    --header-end: #7c5aa8;
    --blue: #2f5fd0;
    --blue-dark: #1f3f96;
    --blue-soft: #e8eefc;
    --purple: #7c4fd0;
    --bg: #f6f5f2;
    --card: #ffffff;
    --border: #e2e0da;
    --text: #1f2320;
    --text-muted: #6b6f6a;
    --danger: #b3413a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--sidebar-lower);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    z-index: 40;
  }
  .sidebar-nav-zone {
    background: linear-gradient(180deg, var(--accent), var(--sidebar-bg-end));
    padding: 20px 12px 16px;
  }
  .sidebar-title { font-size: 12px; font-weight: 400; margin: 4px 12px 18px; color: rgba(255,255,255,.7); letter-spacing: .3px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 8px;
    font-size: 14px; color: rgba(255,255,255,.68);
    cursor: pointer; margin-bottom: 2px;
  }
  .nav-item .ic { font-size: 15px; display: inline-flex; }
  .nav-item.active { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .nav-item:hover:not(.active) { background: rgba(255,255,255,.08); }
  .nav-badge {
    margin-left: auto; background: #e24b4a; color: #fff;
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px;
  }
  /* 1단계-다 (설계서 2-1): 사이드바 메뉴 묶음. 묶음 제목을 누르면 접고 펼친다. */
  .nav-group { margin-bottom: 6px; }
  .nav-group-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px 6px; font-size: 15px; font-weight: 700;
    color: #fff; cursor: pointer; letter-spacing: .2px;
  }
  .nav-group-caret { display: inline-block; width: 14px; font-size: 10px; opacity: .85; transition: transform .15s; }
  /* 묶음 안 메뉴(소메뉴)는 묶음 제목보다 작고 안쪽으로 들여 쓴다 (재홍님 요청 2026-10-20) */
  .nav-group-body .nav-item { font-size: 13px; padding: 8px 12px 8px 30px; }
  .nav-group-body .nav-item .ic svg { width: 14px; height: 14px; }
  .nav-group.collapsed .nav-group-caret { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-body { display: none; }
  .nav-group-new {
    margin-left: auto; background: #e24b4a; color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
  }
  /* 1단계-라-나 (설계서 2-1): 인사평가 묶음 안 작은 제목 "역량평가 · 40%" */
  .nav-group-sub { font-size: 11px; color: rgba(255,255,255,.6); padding: 2px 12px 4px 30px; }
  .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(0,0,0,.08); padding: 10px 12px 16px; }
  .sidebar-me { font-size: 12px; color: var(--text-muted); padding: 6px 12px; }
  .sidebar-logout {
    font-size: 13px; color: var(--danger); cursor: pointer;
    padding: 8px 12px; border-radius: 8px;
  }
  .sidebar-logout:hover { background: rgba(0,0,0,.05); }

  .drawer-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30;
  }
  .drawer-overlay.open { display: block; }
  .hamburger {
    display: none;
    position: relative;
    flex-shrink: 0;
    font-size: 20px; background: none; border: none; cursor: pointer;
    color: var(--text); padding: 4px 8px;
  }
  /* 2026-09-02: 모바일 전용 읽지 않은 알림 배지. 사이드바가 화면 밖에 있는 동안(모바일)
     열어보기 전에도 알림 여부를 알 수 있도록 햄버거 버튼 모서리에 표시. 데스크톱은
     .hamburger 자체가 display:none이라 이 배지도 자연히 안 보인다(별도 분기 불필요). */
  .hamburger-badge {
    position: absolute; top: 0; right: 0;
    background: #e24b4a; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1;
    min-width: 15px; height: 15px; border-radius: 999px;
    align-items: center; justify-content: center;
    padding: 0 3px; border: 2px solid var(--card);
  }

  .content { flex: 1; min-width: 0; }

  .header-stack { position: sticky; top: 0; z-index: 25; }

  .brand-header {
display: flex; align-items: center; gap: 10px;
padding: 13px 24px;
background: linear-gradient(90deg, var(--accent), var(--header-end));
}
  .bh-text { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .brand-header .bh-title { color: #fff; font-weight: 800; font-size: 16px; letter-spacing: .2px; }
  .brand-header .bh-sub { color: rgba(255,255,255,.7); font-size: 12px; letter-spacing: .3px; white-space: nowrap; }
  .brand-header .hamburger { color: #fff; }
  .brand-header .hamburger-badge { border-color: var(--accent); }
  .topbar {
display: flex; align-items: center; gap: 10px; justify-content: space-between;
padding: 16px 24px;
border-bottom: 1px solid var(--border);
background: var(--card);
}
  .search-box {
display: flex; align-items: center; gap: 8px;
color: var(--text-muted); font-size: 14px;
flex: 1; max-width: 320px;
}
.search-box input {
border: none; outline: none; background: transparent;
font-size: 14px; color: var(--text); width: 100%; font-family: inherit;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-clear-btn {
background: none; border: none; color: var(--text-muted); cursor: pointer;
font-size: 13px; padding: 2px 4px; display: none;
}
.search-clear-btn.show { display: inline-block; }
  .team-select { font-size: 13px; color: var(--text-muted); cursor: pointer; }

  .main { padding: 20px 24px 60px; max-width: 760px; margin: 0; }

  .feed-empty {
    text-align: center; color: var(--text-muted); font-size: 13px; padding: 60px 0;
  }
  .feed-loading {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-muted); font-size: 13px; padding: 60px 0;
  }
  .feed-loading .mro-spinner { width: 15px; height: 15px; border-width: 2px; }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    scroll-margin-top: 20px;
  }
  .post-card.flash { animation: flash-highlight 1.6s ease; }
.post-card.all-confirmed { background: var(--accent-soft); border-color: #b9d9cb; }
  @keyframes flash-highlight {
    0% { box-shadow: 0 0 0 3px var(--accent); }
    100% { box-shadow: none; }
  }
  /* ===== 댓글 고정(Pin Comment) 신규 기능 CSS — 기존 규칙은 그대로 두고 전부 추가만 함
     (PIN_COMMENT_CLOUDRUN_DESIGN.md 승인 확정, 2026-09-11 / 목업 디자인 정합 반영, 2026-09-14)
     ===== */
  .comment-item.flash { animation: flash-highlight 1.6s ease; }
  /* 목업(Main.dc.html)의 4방향 스파크 애니메이션 핀 아이콘 — 그대로 재사용 */
  @keyframes spark-flash { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
  .spark { transform-origin: center; transform-box: fill-box; opacity: 0; animation: spark-flash 1.2s ease-in-out infinite; }
  .spark-1 { animation-delay: 0s; }
  .spark-2 { animation-delay: .3s; }
  .spark-3 { animation-delay: .6s; }
  .spark-4 { animation-delay: .9s; }
  /* 재홍님 요청(2026-09-14): 스파크뿐 아니라 핀 아이콘 몸체(종 모양 부분)도 밝아졌다
     어두워졌다 하도록 — 스파크와는 다른 리듬으로(2s), 서로 겹쳐도 산만하지 않게 한다. */
  @keyframes pin-body-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pin-body { animation: pin-body-pulse 2s ease-in-out infinite; }
  #pinned-area { background: var(--danger-soft); }
  .pinned-area-title {
    font-size: 12px; font-weight: 700; color: var(--danger); padding: 10px 24px 0;
  }
  .pinned-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 24px;
    border-top: 1px solid rgba(179,65,58,.16);
  }
  .pinned-item:first-child { border-top: none; }
  .pinned-icon { flex-shrink: 0; overflow: visible; margin-top: 1px; }
  .pinned-text-row {
    flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; cursor: pointer; color: var(--text);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  /* 2026-09-14: 재홍님 요청 반영 - 원자재명이 먼저 눈에 들어와야 해서 굵기를 서로 바꿈
     ("철 (강현민 담당) : 내용" - 원자재명 볼드, 이름/역할은 일반 굵기). */
    /* 2026-09-17: 재홍님 요청 - 핀 아이콘(.pin-body)이 반짝이는 것과 같은 리듬으로 원자재명도
     깜빡이게 함(같은 keyframe 재사용, 서로 다른 요소지만 통일감 유지). */
  .pinned-material { font-weight: 700; animation: pin-body-pulse 2s ease-in-out infinite; }
  .pinned-author { font-weight: 400; }
  .pinned-sep { color: var(--text-muted); }
  .pinned-unpin-btn {
    border: none; background: none; color: var(--text-muted); font-size: 12px;
    cursor: pointer; flex-shrink: 0; padding: 4px 0;
  }
  .pinned-unpin-btn[disabled] { opacity: 0.5; cursor: default; }
  .comment-pin-divider {
    display: inline-block; width: 1px; height: 12px; background: var(--border);
    margin: 0 2px; vertical-align: middle;
  }
  .comment-pin-btn {
    display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600;
    color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .comment-pinned-label {
    display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700;
    color: var(--accent);
  }
  .comment-unpin-btn {
    font-size: 11px; color: var(--text-muted); background: none; border: none;
    cursor: pointer; padding: 4px 0;
  }
  .comment-pin-btn[disabled], .comment-unpin-btn[disabled] { opacity: 0.5; cursor: default; }
  /* 2026-09-14: 이슈 댓글 영역과 같은 톤을 유지 - 스레드 안에서 봐도 "이게 그 고정 댓글이구나"가
     바로 보이도록, 위 #pinned-area와 항상 같은 색을 쓴다(둘 다 --danger-soft). */
  .comment-item.pinned-highlight { background: var(--danger-soft); border-radius: 8px; padding: 6px 8px 8px; }
  .post-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bot-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .bot-icon img { width: 100%; height: 100%; object-fit: cover; }
  .bot-name { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .material-badge {
    font-size: 16px; font-weight: 700; color: var(--blue);
    background: var(--blue-soft); border: 1px solid #c9d9f7;
    padding: 3px 12px; border-radius: 20px;
  }
  .post-time { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .old-post-tag { font-size: 11px; font-weight: 700; color: #7a5b00; background: #fff4d6; border: 1px solid #f0d58a; border-radius: 10px; padding: 1px 8px; white-space: nowrap; } /* 2026-10-23 끼워 넣은 지난 게시물 표시 */
  .post-title { font-size: 16px; font-weight: 700; margin: 2px 0 6px; line-height: 1.4; }
  .post-summary { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }
  .article-link {
    font-size: 13px; color: var(--blue); text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;
  }
  .article-link:hover { text-decoration: underline; }

  .items-box { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .items-box-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; font-size: 12px; color: var(--text-muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }

  .item-row {
    display: grid; grid-template-columns: 1.3fr 1.3fr 1fr;
    align-items: center;
    padding: 12px 14px; font-size: 13px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--bg); }
  .item-row .customer { font-weight: 600; }
  .item-row .status { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .status-dot { font-size: 13px; }
  .status.checked .status-dot { color: var(--accent); }
  .status.unchecked .status-dot { color: #b8bcb8; }
.item-row.checked { background: var(--accent-soft); }

  .comment-thread {
    display: none;
    background: #fbfaf7;
    border-top: 1px dashed var(--border);
    padding: 14px;
  }
  .comment-thread.open { display: block; }
  .thread-empty { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }

  .comment-item { display: flex; gap: 8px; margin-bottom: 12px; }
  .comment-item.pending { opacity: 0.55; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .role-담당 { background: var(--accent); }
  .role-팀장 { background: var(--blue); }
  .role-임원 { background: var(--purple); }
  .comment-body { flex: 1; min-width: 0; }
  .reply-to { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .comment-head { font-size: 12px; margin-bottom: 2px; }
  .comment-head .name { font-weight: 700; color: var(--text); }
  .comment-head .role { color: var(--text-muted); margin-left: 4px; }
  .comment-head .time { color: var(--text-muted); margin-left: 6px; }
  .comment-text { font-size: 13px; line-height: 1.5; color: var(--text); white-space: pre-wrap; }
  .comment-reply-btn {
    font-size: 11px; color: var(--blue); background: none; border: none;
    cursor: pointer; padding: 4px 0; margin-top: 2px;
  }
  .comment-actions { display: flex; gap: 12px; margin-top: 2px; }
  .comment-actions button { margin-top: 0; }
  .comment-edit-btn {
    font-size: 11px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .comment-delete-btn {
    font-size: 11px; color: var(--danger); background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  /* 2026-10-19: 수정 입력창은 .comment-text(white-space: pre-wrap) 안에 들어가므로, 줄바꿈·들여쓰기가
     빈 줄로 보이지 않게 여기서 일반 줄바꿈 규칙으로 되돌린다. 입력창 높이는 글 길이에 맞춰 JS가 정한다(최대 화면 절반). */
  .edit-composer { margin-top: 4px; white-space: normal; }
  .edit-composer textarea {
    width: 100%; resize: none; font-family: inherit; font-size: 13px; line-height: 1.5;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: #fff; min-height: 40px; margin-bottom: 6px; box-sizing: border-box;
    max-height: 50vh; overflow-y: auto; display: block;
  }
  .edit-composer .edit-actions { display: flex; gap: 8px; }
  .edit-composer button {
    border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .edit-composer .save-btn { background: var(--accent); color: #fff; }
  .edit-composer .cancel-btn { background: var(--bg); color: var(--text-muted); }

  .reply-composer { margin-top: 10px; display: flex; gap: 8px; }
  .reply-composer textarea {
    flex: 1; resize: none; font-family: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    background: #fff; min-height: 40px;
  }
  .reply-composer button {
    border: none; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 0 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .reply-composer button:disabled { background: #b8bcb8; cursor: not-allowed; }

  .feed-load-more-btn {
    display: block; width: 100%; margin: 12px 0 24px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
    border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .feed-load-more-btn:disabled { color: #b8bcb8; cursor: not-allowed; }

  .first-comment-btn {
    border: 1px solid var(--accent); color: var(--accent); background: #fff;
    border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .first-comment-form { margin-top: 8px; }
  .thread-error { font-size: 12px; color: var(--danger); margin-top: 6px; }

  .notif-panel { border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; }
  .notif-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--bg); }

function generateIdempotencyKey_() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  // 구형 브라우저(iOS 15.4 미만 Safari 등) 폴백
  return 'idem-' + Date.now() + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

function apiFetchOnce_(action, body) {
  const controller = new AbortController();
  // 응답이 아예 안 오고 멈추는 경우(콜드 스타트/네트워크 지연/GAS 응답 유실 등)를 대비해 일정
  // 시간 후 강제로 요청을 중단시킨다. abort되면 fetch가 예외를 던져 재시도 루프로 이어진다.
  // 액션별로 다른 타임아웃이 필요하면(예: generateReportPrompt) API_REQUEST_TIMEOUT_MS_BY_ACTION에서
  // 찾고, 없으면 기본값을 쓴다.
  const timeoutMs = API_REQUEST_TIMEOUT_MS_BY_ACTION[action] || DEFAULT_API_REQUEST_TIMEOUT_MS;
  const timeoutId = setTimeout(function () { controller.abort(); }, timeoutMs);

// 여러 요청 중 가장 먼저 "성공"하는 응답을 사용한다(Promise.race는 가장 먼저 실패하는 것도
// 그대로 확정해버려서 이 용도에는 안 맞아 직접 구현). 전부 실패해야만 reject한다.
function raceFirstSuccess_(factories) {
  return new Promise(function (resolve, reject) {
    let remaining = factories.length;
    let firstErr = null;
    factories.forEach(function (factory) {
      factory().then(resolve, function (err) {
        if (firstErr === null) firstErr = err;
        remaining -= 1;
        if (remaining === 0) reject(firstErr);
      });
    });
  });
}

// 읽기 전용(조회) 액션 전용. 1차 요청을 보내고, 800ms 안에 응답이 없으면 완전히 동일한 요청을
// 한 번 더(2차) 보내서 두 요청 중 먼저 성공하는 응답을 쓴다. GAS 프록시 구간에서 응답이
// 간헐적으로 유실되는 문제를 완화하기 위한 방어책(2026-08-07 doPost 실행 기록 분석 결과,
// 서버 실행 자체는 항상 빠르게 정상 완료되고 있어 "응답 전달 유실"이 유력한 원인으로 확인됨).
// 중복 전송이라 부작용 없는 조회 액션에만 적용한다.
function hedgedFetch_(action, body) {
  let hedgeTimer = null;
  const primary = apiFetchOnce_(action, body).then(function (r) {
    if (hedgeTimer) clearTimeout(hedgeTimer);
    return r;
  });
  const hedge = new Promise(function (resolve, reject) {
    hedgeTimer = setTimeout(function () {
      apiFetchOnce_(action, body).then(resolve, reject);
    }, API_HEDGE_DELAY_MS);
  });
  return raceFirstSuccess_([function () { return primary; }, function () { return hedge; }]);
}

async function callApi(action, body) {
    const isRetryableRead = RETRYABLE_API_ACTIONS.has(action);
    const isIdempotentWrite = IDEMPOTENT_WRITE_ACTIONS.has(action);
    // 쓰기 액션은 재시도 전체에서 같은 idempotencyKey를 재사용해야 서버가 중복을 걸러낼 수 있다.
    const requestBody = isIdempotentWrite ? Object.assign({ idempotencyKey: generateIdempotencyKey_() }, body) : body;
    // 읽기 전용 액션: hedge 요청으로 최대 3라운드까지 재시도. 쓰기 액션: idempotencyKey를 단 채로
    // 실패 후 짧게 한 번만 더 재시도(서버가 중복 실행을 막아주므로 이제 안전하다). 그 외(로그인
    // 등 인증 흐름)는 기존처럼 1회만 시도.
    const maxRounds = isRetryableRead ? 3 : (isIdempotentWrite ? 2 : 1);
    const __t0 = Date.now();
    let lastErr;
    for (let round = 0; round < maxRounds; round++) {
          try {
                  const useHedge = isRetryableRead && round === 0; const result = useHedge
                    ? await hedgedFetch_(action, requestBody)
                            : await apiFetchOnce_(action, requestBody);
                  hideConnDelayNotice_();
                  if (round > 0) logApiDelayEvent_(action, round, 'recovered', Date.now() - __t0);
                  return result;
          } catch (e) {
                  lastErr = e;
                  if (round < maxRounds - 1) {
                            if (isRetryableRead && round === 0) {
                                        showConnDelayNotice_();
                                        logApiDelayEvent_(action, round, 'delayed', Date.now() - __t0);
                            }
                            await new Promise(function (resolve) { setTimeout(resolve, API_ROUND_BACKOFF_MS[round] || 6000); });
                  }
          }
    }
    hideConnDelayNotice_();
    logApiDelayEvent_(action, maxRounds - 1, 'failed', Date.now() - __t0);
    throw lastErr;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');

  return `${d.getMonth() + 1}.${d.getDate()} ${hh}:${mm}`;

async function submitForcedPasswordChange() {
const currentPassword = document.getElementById('pw-current-input').value;
const newPassword = document.getElementById('pw-new-input').value;
const confirmPassword = document.getElementById('pw-new-confirm-input').value;
const msg = document.getElementById('pw-change-msg');
if (!currentPassword || !newPassword || !confirmPassword) {
msg.textContent = '모든 항목을 입력해주세요.';
return;
}
if (newPassword.length < 6) {
msg.textContent = '새 비밀번호는 6자 이상이어야 해요.';
return;
}
if (newPassword !== confirmPassword) {
msg.textContent = '새 비밀번호가 서로 일치하지 않아요.';
return;
}
msg.textContent = '변경 중...';
try {
// changePassword Cloud Run 배선(설계 승인 완료 — USERMGMT_CLOUDRUN_DESIGN.md):
// CLOUD_RUN_CHANGE_PASSWORD_URL이 채워져 있으면 changePasswordRemote_()의 3단 폴백 정책을
// 먼저 시도하고, 비어 있으면(롤백 상태) 기존 Apps Script 경로를 그대로 쓴다 — upsertItem과
// 동일한 "빈 문자열로 롤백" 스위치 패턴.
const res = (await changePasswordRemote_({ currentPassword: currentPassword, newPassword: newPassword }))
  || await callApi('changePassword', { currentPassword: currentPassword, newPassword: newPassword });
if (!res.ok) {
if (res.error === 'AMBIGUOUS_NEEDS_CONFIRMATION') {
  msg.textContent = '변경 여부를 확인할 수 없습니다. 잠시 후 다시 로그인해서 확인해주세요.';
  return;
}
const errMap = { WRONG_PASSWORD: '현재 비밀번호가 올바르지 않아요.', PASSWORD_TOO_SHORT: '새 비밀번호는 6자 이상이어야 해요.' };
msg.textContent = errMap[res.error] || ('변경 실패: ' + (res.error || 'SERVER_ERROR'));
return;
}
session.passwordExpired = false;
localStorage.setItem('mro_session', JSON.stringify(session));
const overlay = document.getElementById('pw-change-overlay');
if (overlay) overlay.remove();
await proceedAfterAuth();
} catch (e) {
msg.textContent = '네트워크 오류가 발생했어요.';
}
}

const itemCommentCounts = {};

function primeCommentsFromFeed(posts) {
  // A. 댓글 예열: getFeed가 이미 품목별 comments를 실어보내므로, 스레드를 열 때마다
  // getComments를 다시 호출하지 않도록 postComments 캐시를 미리 채워둔다.
  // B. 폴링 비교용으로 품목별 commentCount도 같이 기록해둔다.
  (posts || []).forEach(function (post) {
    let merged = [];
    (post.items || []).forEach(function (it) {
      itemCommentCounts[post.id + '-' + it.itemId] = it.commentCount || 0;
      if (it.comments && it.comments.length) merged = merged.concat(it.comments);
    });
    postComments[post.id] = { loaded: true, comments: merged };
  });
}

function startPolling() {
  if (pollTimer) return;
  // setInterval 대신 재귀 setTimeout을 쓴다: pollForUpdates 한 번이 재시도 때문에 30초보다
  // 오래 걸리는 경우가 실제로 있었는데, setInterval은 그 이전 호출이 아직 안 끝났어도 다음
  // 틱을 그냥 또 쏴버려서 요청이 겹쳐 쌓이는 문제가 있었다(디버그로그에서 확인). 재귀 setTimeout은
  // 이전 호출이 끝난 뒤에야 다음 타이머를 거니까 구조적으로 겹칠 수가 없다.
  // 2026-10-29 요금 절감(A안 1단계): 화면이 보일 때 1분, 가려져 있을 때(다른 탭/화면 꺼짐) 10분에 한 번.
  // 타이머는 1분 그대로 두고 "가려짐 + 마지막 폴링 10분 미만"이면 건너뛰기만 하므로, 화면으로
  // 돌아오면 refreshOnResume의 즉시 갱신 + 1분 주기로 바로 복귀한다.
  const scheduleNext = function () {
    pollTimer = setTimeout(function () {
      if (document.visibilityState === 'hidden' && Date.now() - pollLastStartAt < POLL_HIDDEN_MS) { scheduleNext(); return; }
      pollForUpdates().finally(scheduleNext);
    }, POLL_VISIBLE_MS);
  };
  scheduleNext();
}

// PWA/브라우저가 백그라운드에서 동결(freeze)됐다가 다시 화면에 보이게 될 때(iOS PWA 복귀, PC 절전 복귀,
// 크롬 메모리 절약 모드 복귀 등) 오래된(stale) 알림/피드 상태가 잠깐 잘못 보이는 문제를 막기 위해,
// 화면이 다시 보이는 즉시 최신 데이터로 강제 갱신한다.
// iOS PWA는 앱 전환기에서 돌아올 때 visibilitychange가 안 잡히는 경우가 있어,
// pageshow(bfcache 복귀)와 window focus도 같이 걸어 이중삼중으로 안전하게 잡는다.
let lastResumeRefreshAt = 0;
function refreshOnResume() {
  suppressConnDelayNoticeUntil_ = Date.now() + 8000;
  const now = Date.now();
  if (now - lastResumeRefreshAt < 2000) return; // 여러 이벤트가 한번에 겹쳐 몰려도 중복 호출 방지
  lastResumeRefreshAt = now;
  if (!(session && session.sessionToken)) return;
  // iOS가 백그라운드에서 깨어난 직후엔 와이파이/셀룰러가 아직 완전히 준비 안 된 경우가 있어
  // 살짝 지연 후 요청하고, 그래도 실패하면 한번 더 재시도한다.
  // [2026-09-01 알림 구조 개선 3차] 복귀로 인해 아래에서 동시에 도는 작업들(loadFeed 내부 게이트,
  // pollForUpdates, 알림탭이면 추가 재조회)이 각자 updateNotifBadge()를 부를 수 있다. 예전에는
  // "첫 계산 1번만" 억제하는 플래그(suppressNextLocalNotif)를 썼는데, 그중 캐시 기반으로 먼저
  // 끝난 계산이 플래그를 조기 소비해버리고 뒤이은 진짜 최신 계산은 억제가 안 되는 레이스가 있었다
  // (재홍님 실제 재현 확인). appActivating은 "첫 계산"이 아니라 "이 복귀 사이클에서 도는 작업이
  // 전부 끝날 때"까지 유지되므로, 그중 어느 경로가 몇 번 updateNotifBadge()를 불러도 전부 안전하게
  // 기준선만 맞추고 넘어간다 — evaluateLocalNotification_() 참고.
  beginAppActivating_();
  setTimeout(function () {
    const tasks = [loadFeed(), pollForUpdates({ resume: true })]; // 알림 배지 갱신은 pollForUpdates 내부에서도 처리됨
    if (currentView === 'items') tasks.push(loadItems());
    if (currentView === 'notif') { tasks.push(loadNotifNewPosts().then(function () { renderNotif(); updateNotifBadge(); })); }
    if (currentView === 'users') tasks.push(loadUsers());
    Promise.all(tasks).finally(endAppActivating_);
  }, 600);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') refreshOnResume();
});
window.addEventListener('pageshow', function (e) {
  if (e.persisted || document.visibilityState === 'visible') refreshOnResume();
});
window.addEventListener('focus', refreshOnResume);

async function pollForUpdates(opts) {
pollLastStartAt = Date.now();
try {
let res;
const __psT0 = Date.now();
let __psCloudOk = false;
// pollSignal 실제 이전(2026-08-18): Cloud Run 먼저 시도 -> 실패/타임아웃/예외면 기존
// Apps Script pollSignal로 자동 폴백. CLOUD_RUN_GET_SETTINGS_URL 폴백 패턴과 동일.
if (CLOUD_RUN_POLLSIGNAL_URL) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
    const cloudRes = await fetch(CLOUD_RUN_POLLSIGNAL_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionToken: session ? session.sessionToken : null }), signal: controller.signal }).then(function (r) { return r.json(); });
    clearTimeout(timeoutId);
    if (cloudRes && cloudRes.ok) { res = cloudRes; __psCloudOk = true; }
  } catch (e) {}
}
if (__psCloudOk) {
  console.log('[pollSignal] source=cloud-run clientMs=' + (Date.now() - __psT0));
} else {
  res = await callApi('pollSignal', {});
  console.log('[pollSignal] source=apps-script clientMs=' + (Date.now() - __psT0));
}
if (!res.ok) {
if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
doLogout();
}
return;
}
feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
// 2026-10-29 요금 절감(A안 1단계): 신호가 직전과 같으면 알림 목록·고정 댓글을 다시 받지 않는다.
const __sigKey = pollSigKey_(res);
const __changed = __sigKey !== notifSigKey;
if (__changed) {
  const __okBefore = notifLastOkAt;
  await loadNotifNewPosts();
  if (notifLastOkAt !== __okBefore) notifSigKey = __sigKey; // 실패하면 기록하지 않아 다음 폴링에서 다시 받는다
}
updateNotifBadge();
// 댓글 고정(Pin Comment) — 예전엔 30초 폴링마다 새로고침했다. 이제는 신호가 바뀌었을 때, 또는
// 화면 복귀 시 마지막으로 받은 지 10분이 지났을 때만 새로고침한다(고정/해제만 하고 댓글 변화가
// 없으면 신호에 안 잡히므로 복귀 시 보정). 시황 뉴스 탭으로 이동할 때 받는 기존 경로(switchView)는 그대로.
if (__changed || (opts && opts.resume && Date.now() - pinnedLastOkAt >= PINNED_RESUME_MS)) {
  loadPinnedComments().catch(function () {});
}

const postsToRefresh = new Set();
(res.signatures || []).forEach(function (sig) {
const key = sig.postId + '-' + sig.itemId;
const known = itemCommentCounts[key];
if (known === undefined) return;
if (known !== sig.commentCount) postsToRefresh.add(sig.postId);
});

let feedNeedsRerender = false;
for (const postId of postsToRefresh) {
await loadComments(postId);
const pc = postComments[postId];
if (pc && pc.comments) {
const counts = {};
pc.comments.forEach(function (c) { counts[c.itemId] = (counts[c.itemId] || 0) + 1; });
Object.keys(counts).forEach(function (itemId) {
itemCommentCounts[postId + '-' + itemId] = counts[itemId];
});
// 확인 N/6 배지가 폴링 때 갱신되지 않던 문제 수정: 댓글 여부에 따라
// 품목별 confirmed/commentCount와 게시물의 confirmedCount를 다시 계산한다.
const post = feedState.posts.find(function (p) { return String(p.id) === String(postId); });
if (post && post.items) {
post.items.forEach(function (it) {
const c = counts[it.itemId] || 0;
it.commentCount = c;
it.confirmed = c > 0;
});
post.confirmedCount = post.items.filter(function (it) { return it.confirmed; }).length;
post.totalCount = post.items.length;
feedNeedsRerender = true;
}
}
Object.keys(threadState).forEach(function (key) {
if (key.indexOf(postId + '-') === 0 && threadState[key].open && !threadState[key].replyOpenFor) {
const itemId = key.slice((postId + '-').length);
renderThread(postId, itemId);
}
});
}
if (feedNeedsRerender && !hasOpenComposer() && !hasGeneratingReportPrompt_()) renderFeed();
} catch (e) {
// 조용히 실패, 다음 주기에 재시도
}
}

async function loadFeed(isRetry) {
  const root = document.getElementById('feed-root');
  try {
    let res = null;
    let __gfCloudOk = false;
    const __gfT0 = Date.now();
    if (CLOUD_RUN_GET_FEED_URL) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
        const cloudRes = await fetch(CLOUD_RUN_GET_FEED_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionToken: session ? session.sessionToken : null, cursor: 0 }),
          signal: controller.signal
        }).then(function (r) { return r.json(); });
        clearTimeout(timeoutId);
        if (cloudRes && cloudRes.ok === true) {
          res = cloudRes;
          __gfCloudOk = true;
        }
      } catch (e) {}
    }
    if (__gfCloudOk) {
      console.log('[getFeed] source=cloud-run clientMs=' + (Date.now() - __gfT0));
    } else {
      res = await callApi('getFeed', { cursor: 0 });
      console.log('[getFeed] source=apps-script clientMs=' + (Date.now() - __gfT0));
    }
    if (!res.ok) {
      if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
        doLogout();
        return false;
      }
      // loadItems()는 !ok 응답에 대해 한번 자동 재시도하는데 loadFeed()는 그렇지 않았던 것이
      // 실제 원인으로 확인됨: 백그라운드 복귀 직후 POST 요청이 앱스스크립트 인프라의 리다이렉트
      // 과정에서 간헐적으로 GET으로 바뀌어 처리되며 ok:false, error:'NOT_FOUND' 응답이 오는
      // 사례를 실제 화면(스크린샷)과 코드로 확인했다. loadItems()와 동일하게 한번만 재시도한다.
      if (!isRetry) { setTimeout(function () { loadFeed(true); }, 1800); return true; }
      root.innerHTML = `<div class="feed-empty">피드를 불러오지 못했어요. (${escapeHtml(res.error || 'SERVER_ERROR')})</div>`;
      return true;
    }
    feedState.posts = res.posts || [];
    feedInjectedIds_ = new Set();
    primeCommentsFromFeed(res.posts || []);
    feedState.nextCursor = res.nextCursor; feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
    if (!hasOpenComposer() && !hasGeneratingReportPrompt_()) renderFeed();
// [2026-09-01 알림 중복 수정 2차] notifNewPostsCache만 로드됐다고 바로 계산하면, proceedAfterAuth()의
// 최초 실행 시(loadFeed/loadThreadSeenMap/loadNotifNewPosts를 동시에 시작) getFeed가 getThreadSeen보다
// 먼저 끝나는 경우 threadSeenMapLoaded가 아직 false라서 hasUnreadReply/hasAwaitingReply가 전부 false를
// 반환한다(그 함수들 자체의 가드). 그 상태로 여기서 lastNotifCount 기준선이 실제보다 낮게(댓글
// 필요/답변 요청 건수가 빠진 채) 잡히고, 곧이어 threadSeenMap이 마저 로드된 뒤 proceedAfterAuth()의
// updateNotifBadge()(정상 카운트)가 호출되면 그 사이에 카운트가 오른 것처럼 보여 인앱 알림이 스스로
// 발동했다 — 브라우저/탭이 완전히 닫혀 있다가 FCM 알림 클릭으로 새로 열리는 콜드 스타트에서도
// (백그라운드 복귀와 무관하게) 재현되는 별개의 원인이었다. threadSeenMap까지 같이 준비된 뒤에만 계산한다.
if (notifNewPostsCache.loaded && threadSeenMapLoaded) updateNotifBadge();
    return true;
  } catch (e) {
    // 백그라운드 복귀 직후엔 네트워크가 아직 안 붙어 실패할 수 있어 한번만 자동 재시도
    if (!isRetry) { setTimeout(function () { loadFeed(true); }, 1800); return true; }
    root.innerHTML = `<div class="feed-empty">네트워크 오류가 발생했어요. 새로고침 후 다시 시도해주세요.</div>`;
    return true;
  }
}

async function loadMoreFeed() {
  if (feedState.loadingMore || feedState.nextCursor === null || feedState.nextCursor === undefined) return;
  feedState.loadingMore = true;
  renderLoadMoreButton();
  try {
    let res = null;
    let __gfCloudOk = false;
    const __gfT0 = Date.now();
    const __gfCursor = feedState.nextCursor;
    if (CLOUD_RUN_GET_FEED_URL) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
        const cloudRes = await fetch(CLOUD_RUN_GET_FEED_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionToken: session ? session.sessionToken : null, cursor: __gfCursor }),
          signal: controller.signal
        }).then(function (r) { return r.json(); });
        clearTimeout(timeoutId);
        if (cloudRes && cloudRes.ok === true) {
          res = cloudRes;
          __gfCloudOk = true;
        }
      } catch (e) {}
    }
    if (__gfCloudOk) {
      console.log('[getFeed] source=cloud-run clientMs=' + (Date.now() - __gfT0));
    } else {
      res = await callApi('getFeed', { cursor: __gfCursor });
      console.log('[getFeed] source=apps-script clientMs=' + (Date.now() - __gfT0));
    }
    if (!res.ok) {
      if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
        doLogout();
        return;
      }
      feedState.loadingMore = false;
      renderLoadMoreButton();
      return;
    }
    feedState.posts = feedState.posts.concat(res.posts || []);
    primeCommentsFromFeed(res.posts || []);
    feedState.nextCursor = res.nextCursor; feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
    feedState.loadingMore = false;
    renderFeed();
    updateNotifBadge();
  } catch (e) {
    feedState.loadingMore = false;
    renderLoadMoreButton();
  }
}

function renderLoadMoreButton() {
  const el = document.getElementById('feed-load-more');
  if (!el) return;
  if (feedState.nextCursor === null || feedState.nextCursor === undefined) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.disabled = feedState.loadingMore;
  el.textContent = feedState.loadingMore ? '불러오는 중...' : '더보기';
}

function updateNotifBadge() {
const showAwaiting = session.role === '팀장' || session.role === '임원';
const newItemsCount = notifNewPostsCache.items.reduce(function (sum, p) {
if (!p.needsAttention) return sum;
return sum + (p.items || []).filter(function (it) { return !it.confirmed; }).length;
}, 0);
let count = newItemsCount;
notifNewPostsCache.items.forEach(function (p) {
count += (p.items || []).filter(function (it) { return hasUnreadReply(p.id, it); }).length;
if (showAwaiting) count += (p.items || []).filter(function (it) { return hasAwaitingReply(p.id, it); }).length;
});
// [TEMP-DIAG 임시 디버그였던 코드 제거 2026-08-06] updateNotifBadge()는 피드 렌더/댓글 로드/탭 전환 등
// 10곳 넘는 곳에서 계속 호출되는데, 그때마다 매번 전체 posts/items 배열을 clientDebugLog로 서버에 통째로
// 보내고 있었다(시트에 append까지 함). 애니메이션 지연 진단이 끝나서 더 이상 필요 없고, 오히려 사용자
// 인터랙션마다 불필요한 앱스스크립트 호출(+시트 쓰기)을 계속 발생시켜 백엔드 부하에 기여하고 있었다.
// 2026-09-02: 사이드바 배지(#notif-badge)와 모바일 햄버거 배지(#hamburger-badge) 둘 다
// 이 count를 그대로 재사용한다(별도 계산/추가 API 호출 없음). 표시 형식도 두 곳 동일하게
// 통일: count가 0이면 숨김, 1~99는 숫자 그대로, 100 이상은 자릿수 폭주를 막기 위해 "99+".
const badgeText = count > 99 ? '99+' : String(count);
const badge = document.getElementById('notif-badge');
if (count > 0) {
badge.textContent = badgeText;
badge.style.display = 'inline-block';
} else {
badge.style.display = 'none';
}
const mroGroupNew = document.getElementById('nav-group-mro-new');
if (mroGroupNew) mroGroupNew.style.display = count > 0 ? 'inline-block' : 'none';
const hamburgerBadge = document.getElementById('hamburger-badge');
if (hamburgerBadge) {
if (count > 0) {
hamburgerBadge.textContent = badgeText;
hamburgerBadge.style.display = 'flex';
} else {
hamburgerBadge.style.display = 'none';
}
}


if ('setAppBadge' in navigator) {
if (count > 0) navigator.setAppBadge(count).catch(function () {});
else navigator.clearAppBadge().catch(function () {});
}

// [2026-09-01 알림 구조 개선 3차] 알림을 띄울지 판단하는 로직은 더 이상 여기 인라인으로 두지
// 않는다 — evaluateLocalNotification_() 한 곳으로 모아서, updateNotifBadge()를 부르는 10여
// 군데 어디서 호출되든 항상 같은 규칙(appActivating이면 기준선만 조용히 갱신)을 따르게 한다.
evaluateLocalNotification_(count);
}

// 6-5: 검색 기능 (현재 로드된 피드 안에서 클라이언트 사이드 필터링)
function matchesSearch(post, query) {
if ((post.materialName || '').toLowerCase().includes(query)) return true;
if ((post.summary || '').toLowerCase().includes(query)) return true;
return (post.items || []).some(function (it) {
return (it.customer || '').toLowerCase().includes(query) || (it.itemName || '').toLowerCase().includes(query);
});
}

function handleSearchInput() {
const input = document.getElementById('search-input');
const clearBtn = document.getElementById('search-clear-btn');
feedState.searchQuery = input.value;
clearBtn.classList.toggle('show', !!input.value);
if (document.getElementById('feed-view').style.display !== 'none') {
renderFeed();
}
}

function clearSearch() {
const input = document.getElementById('search-input');
input.value = '';
feedState.searchQuery = '';
document.getElementById('search-clear-btn').classList.remove('show');
renderFeed();
input.focus();
}

function setupTeamLabelControl() {
const el = document.getElementById('team-label');
if (!el) return;
const isAdmin = session.email === ADMIN_EMAIL;
if (!isAdmin) {
el.textContent = teamLabel(session.team || '') + ' 전체';
return;
}
const teams = Array.from(new Set(feedState.posts.flatMap(function (p) { return (p.items || []).map(function (it) { return it.team; }); }).filter(Boolean)));
feedState.teamFilter = session.team || '동부';
const optionsHtml = ['<option value="">전체 팀</option>'].concat(teams.map(function (t) {
return '<option value="' + escapeHtml(t) + '" ' + (t === feedState.teamFilter ? 'selected' : '') + '>' + escapeHtml(teamLabel(t)) + '</option>';
})).join('');
const select = document.createElement('select');
select.id = 'team-label';
select.className = 'team-select';
select.setAttribute('onchange', 'onTeamFilterChange()');
select.innerHTML = optionsHtml;
el.replaceWith(select);
renderFeed();
}

function onTeamFilterChange() {
feedState.teamFilter = document.getElementById('team-label').value;
renderFeed();
}

function renderFeed() {
const root = document.getElementById('feed-root');
if (!feedState.posts.length) {
root.innerHTML = `<div class="feed-empty">아직 게시된 시황이 없어요.</div>`;
return;
}
const query = (feedState.searchQuery || '').trim().toLowerCase();
const teamFilter = feedState.teamFilter || '';
let list = feedState.posts;
if (teamFilter) {
list = list.filter(function (p) { return (p.items || []).some(function (it) { return it.team === teamFilter; }); });
}
if (query) {
list = list.filter(function (p) { return matchesSearch(p, query); });
}
if ((query || teamFilter) && !list.length) {
root.innerHTML = `<div class="feed-empty">조건에 맞는 게시물이 없어요.</div>`;
return;
}
const hasMore = !query && feedState.nextCursor !== null && feedState.nextCursor !== undefined;
root.innerHTML = list.map(renderPost).join('') +
(hasMore ? `<button id="feed-load-more" class="feed-load-more-btn" onclick="loadMoreFeed()">더보기</button>` : '');
restoreOpenThreads();
restoreOpenReportPrompts_();
}

function restoreOpenThreads() {
// restore threads left open before rerender
(feedState.posts || []).forEach(function (post) {
(post.items || []).forEach(function (item) {
const key = post.id + '-' + item.itemId;
const st = threadState[key];
if (!st || !st.open) return;
const panel = document.getElementById('thread-' + key);
if (!panel) return;
panel.classList.add('open');
renderThread(post.id, item.itemId);
});
});
}

let notifActiveTab = '새 게시물';
// [2026-09-09 알림 선택 삭제/읽음 처리] '댓글 필요'/'답변 요청' 탭 전용 체크박스 선택 상태.
// 탭별로 별도 Set을 두어 탭을 오가도 서로의 선택이 유지되게 한다(요청사항 "복수 탭 독립성").
// 페이지를 새로고침하면 초기화된다 — 서버에 저장하는 값이 아니라 순전히 이번 화면 조작 중의
// 임시 선택 상태이기 때문에 그럴 필요가 없다.
let notifSelection = { '댓글 필요': new Set(), '답변 요청': new Set() };

// 2026-10-12: 알림 탭 고정용 — 보라색 머리글(.header-stack) 높이를 CSS 변수 --header-stack-h로 알려주고
// (화면 폭·이슈 댓글 배너 여부에 따라 높이가 달라짐), 탭이 머리글에 붙어 있을 때만 옅은 그림자를 준다.
(function watchHeaderStackHeight_() {
  function setH() {
    const hs = document.querySelector('.header-stack');
    if (hs) document.documentElement.style.setProperty('--header-stack-h', Math.round(hs.getBoundingClientRect().height) + 'px');
  }
  function updateStuck() {
    const el = document.getElementById('notif-sticky');
    if (!el || !el.offsetParent) return;
    const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-stack-h')) || 0;
    el.classList.toggle('is-stuck', el.getBoundingClientRect().top <= top + 1 && window.scrollY > 0);
  }
  try {
    const hs = document.querySelector('.header-stack');
    if (hs && window.ResizeObserver) new ResizeObserver(function () { setH(); updateStuck(); }).observe(hs);
  } catch (e) {}
  window.addEventListener('resize', setH);
  window.addEventListener('scroll', updateStuck, { passive: true });
  window.__updateNotifStuck_ = updateStuck;
  setH();
})();

function renderNotif() {
const root = document.getElementById('notif-view');

const newPosts = notifNewPostsCache.items.filter(function (p) {
return p.needsAttention && (p.items || []).some(function (it) { return !it.confirmed; });
});

const newPostsItemCount = newPosts.reduce(function (sum, p) { return sum + (p.items || []).filter(function (it) { return !it.confirmed; }).length; }, 0);

const newPostEntries = newPosts.map(function (p) { return { post: p, items: (p.items || []).filter(function (it) { return !it.confirmed; }) }; });

const replyEntries = [];
const awaitingEntries = [];
notifNewPostsCache.items.forEach(function (p) {
const unreadItems = (p.items || []).filter(function (it) { return hasUnreadReply(p.id, it); });
if (unreadItems.length) replyEntries.push({ post: p, items: unreadItems });
const awaitingItems = (p.items || []).filter(function (it) { return hasAwaitingReply(p.id, it); });
if (awaitingItems.length) awaitingEntries.push({ post: p, items: awaitingItems });
});

const showAwaitingTab = session.role === '팀장' || session.role === '임원';

const replyItemCount = replyEntries.reduce(function (sum, e) { return sum + e.items.length; }, 0);
const awaitingItemCount = awaitingEntries.reduce(function (sum, e) { return sum + e.items.length; }, 0);
const tabs = [
{ key: '새 게시물', count: newPostsItemCount },
{ key: '댓글 필요', count: replyItemCount }
];
if (showAwaitingTab) {
tabs.push({ key: '답변 요청', count: awaitingItemCount });
}
if (!tabs.some(function (t) { return t.key === notifActiveTab; })) {
notifActiveTab = tabs[0].key;
}

const tabsHtml = tabs.map(function (t) {
return `<button class="notif-tab ${t.key === notifActiveTab ? 'active' : ''}" onclick="switchNotifTab('${t.key}')">${t.key} <span class="notif-tab-count">${t.count}</span></button>`;
}).join('');

let contentHtml = '';
if (notifActiveTab === '새 게시물') {
contentHtml = renderNotifNewPosts(newPostEntries);
} else if (notifActiveTab === '댓글 필요') {
contentHtml = renderNotifReplyEntries(replyEntries, false);
} else if (notifActiveTab === '답변 요청') {
contentHtml = renderNotifReplyEntries(awaitingEntries, true);
}

// [2026-09-09 알림 선택 삭제/읽음 처리] 예전엔 이 자리에서 "알림 전체 지우기" 버튼 하나만
// 노출했다(clearAllNotifInActiveTab, 2026-09-01). 팀장/임원이 실제로 운영해보니 전체 일괄
// 삭제보다 확인 끝난 것만 골라 지우는 게 더 필요하다는 의견이 있어, 체크박스 기반 선택
// 삭제/읽음 처리로 대체했다 - '전체 선택' 체크 후 버튼을 누르면 예전과 동일하게 전체 일괄
// 처리도 그대로 되므로 기능 손실은 없다.
const showClearBtn = (notifActiveTab === '댓글 필요' || notifActiveTab === '답변 요청') && (session.role === '팀장' || session.role === '임원');
let clearToolbarHtml = '';
if (showClearBtn) {
const sel = notifSelection[notifActiveTab];
const visibleKeys = (notifActiveTab === '답변 요청' ? awaitingEntries : replyEntries)
.reduce(function (keys, e) { return keys.concat(e.items.map(function (it) { return notifPairKey_(e.post.id, it.itemId); })); }, []);
// 화면에서 이미 사라진(다른 경로로 방금 확인 처리된) 항목의 선택은 지운다 - 안 그러면
// "N개 선택됨" 숫자가 실제 화면과 안 맞을 수 있다.
Array.from(sel).forEach(function (k) { if (visibleKeys.indexOf(k) === -1) sel.delete(k); });
const selectedCount = sel.size;
const allSelected = visibleKeys.length > 0 && selectedCount === visibleKeys.length;
clearToolbarHtml = `
<div class="notif-clear-toolbar">
<label class="notif-selectall-wrap">
<input type="checkbox" ${allSelected ? 'checked' : ''} onchange="toggleNotifSelectAll_('${notifActiveTab}', this.checked)">
<span>전체 선택</span>
</label>
${selectedCount > 0 ? `<span class="notif-selected-count">${selectedCount}개 선택됨</span>` : ''}
<button class="notif-clear-btn" ${selectedCount === 0 ? 'disabled' : ''} onclick="confirmMarkSelectedNotifSeen_()">선택한 알림 확인 처리</button>
</div>`;
}

root.innerHTML = `
<div class="notif-panel notif-panel-tabs">
<div class="notif-sticky" id="notif-sticky">
<div class="notif-tabs">${tabsHtml}</div>
${clearToolbarHtml}
</div>
<div class="notif-tab-content">${contentHtml || '<div class="notif-empty">여기엔 알림이 없어요.</div>'}</div>
</div>
`;
updateNotifPermButton();
try { if (window.__updateNotifStuck_) window.__updateNotifStuck_(); } catch (e) {}
}

function switchNotifTab(key) {
notifActiveTab = key;
renderNotif();
}

// [2026-09-09 알림 선택 삭제/읽음 처리] 아래 4개 함수가 예전 clearAllNotifInActiveTab()
// (2026-09-01, "알림 전체 지우기" 일괄 삭제)을 대체한다. 이 시스템의 "알림"은 별도로 저장되는
// 레코드가 아니라 threadSeenMap의 확인 시각과 최신 댓글 시각을 매번 비교해 계산되는 값이라
// (hasUnreadReply/hasAwaitingReply 참고), "삭제"와 "읽음 처리"가 서버 입장에서 완전히 같은
// 동작이다 — 그래서 버튼을 "삭제"/"읽음 처리" 둘로 나누지 않고 하나로 통합했다(재홍님 질문
// 2·3에 대한 답과 동일한 근거). 실제 처리는 예전과 동일하게 스레드마다 markThreadSeenLocal()을
// 호출한다 — threadSeenMap 갱신(클라이언트) + markThreadSeenRemote_()(Cloud Run 우선, 실패 시
// Apps Script 폴백)를 그대로 재사용하므로 서버측 "댓글확인이력" 반영도 기존 경로와 동일하게
// 보장된다. 새 API는 필요 없었다.

// '댓글 필요'/'답변 요청' 탭에 지금 이 순간 표시되는 항목을 (postId, itemId) 목록으로 계산한다.
// renderNotif()의 replyEntries/awaitingEntries는 그 함수의 지역 변수라 여기서 재사용할 수
// 없으므로, notifNewPostsCache.items를 hasUnreadReply/hasAwaitingReply로 다시 걸러 새로
// 계산한다 - 예전 clearAllNotifInActiveTab()과 같은 방식.
function computeNotifPairsForTab_(tab) {
const isAwaiting = tab === '답변 요청';
const pairs = [];
notifNewPostsCache.items.forEach(function (p) {
(p.items || []).forEach(function (it) {
const matches = isAwaiting ? hasAwaitingReply(p.id, it) : hasUnreadReply(p.id, it);
if (matches) pairs.push({ postId: p.id, itemId: it.itemId });
});
});
return pairs;
}
function notifPairKey_(postId, itemId) { return postId + '-' + itemId; }

function toggleNotifCheckbox_(tab, key, checked) {
const sel = notifSelection[tab];
if (!sel) return;
if (checked) sel.add(key); else sel.delete(key);
renderNotif();
}

function toggleNotifSelectAll_(tab, checked) {
const sel = notifSelection[tab];
if (!sel) return;
if (checked) {
computeNotifPairsForTab_(tab).forEach(function (pair) { sel.add(notifPairKey_(pair.postId, pair.itemId)); });
} else {
sel.clear();
}
renderNotif();
}

function confirmMarkSelectedNotifSeen_() {
const tab = notifActiveTab;
if (tab !== '댓글 필요' && tab !== '답변 요청') return;
if (session.role !== '팀장' && session.role !== '임원') return;

const sel = notifSelection[tab];
const selectedPairs = computeNotifPairsForTab_(tab).filter(function (pair) { return sel.has(notifPairKey_(pair.postId, pair.itemId)); });
if (!selectedPairs.length) return; // 버튼이 disabled라 보통 여기 오지 않지만 방어적으로 한 번 더 확인

if (!confirm(`'${tab}' 탭에서 선택한 알림 ${selectedPairs.length}건을 확인 처리할까요? 되돌릴 수 없어요.`)) return;

selectedPairs.forEach(function (pair) { markThreadSeenLocal(pair.postId, pair.itemId); });
sel.clear();
renderNotif();
}

function renderNotifNewPosts(entries) {
if (!entries.length) return '';
return entries.map(function (entry) {
const p = entry.post;
const rowsHtml = entry.items.map(function (it) {
return `
<div class="notif-reply-row" onclick="goToItem('${p.id}', '${it.itemId}')">
<div class="top-line">${escapeHtml(it.customer || '')} · ${escapeHtml(it.itemName || '')} · ${escapeHtml(it.manager || '')}</div>
</div>
`;
}).join('');
return `
<div class="notif-post-card">
<div class="top-line"><span class="material-badge" style="font-size:11px;padding:1px 8px;">${escapeHtml(p.materialName || '')}</span> ${escapeHtml(fmtTime(p.createdAt))}</div>
<div class="headline">${escapeHtml(truncate(p.summary || p.title || '', 36))}</div>
<div class="notif-reply-list">${rowsHtml}</div>
</div>
`;
}).join('');
}

function renderNotifReplyEntries(entries, isAwaiting) {
if (!entries.length) return '';
// 체크박스/선택 삭제는 위 renderNotif()의 toolbar와 같은 기준(팀장/임원 전용)으로만 보여준다.
// 다른 역할은 예전처럼 목록만 보고 항목 클릭으로 이동한다.
const showCheckboxes = session.role === '팀장' || session.role === '임원';
const tabKey = isAwaiting ? '답변 요청' : '댓글 필요';
const sel = notifSelection[tabKey];
return entries.map(function (entry) {
const p = entry.post;
const rowsHtml = entry.items.map(function (it) {
const comments = (it.comments || []).slice().sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
const prev = comments.length >= 2 ? comments[comments.length - 2] : null;
const curr = comments.length >= 1 ? comments[comments.length - 1] : null;
const key = notifPairKey_(p.id, it.itemId);
const checkboxHtml = showCheckboxes ? `
<label class="notif-check-wrap" onclick="event.stopPropagation()">
<input type="checkbox" ${sel.has(key) ? 'checked' : ''} onchange="toggleNotifCheckbox_('${tabKey}', '${key}', this.checked)">
</label>` : '';
return `
<div class="notif-reply-row">
${checkboxHtml}
<div class="notif-reply-row-body" onclick="goToItem('${p.id}', '${it.itemId}')">
<div class="top-line">${escapeHtml(it.customer || '')} · ${escapeHtml(it.itemName || '')} · ${escapeHtml(it.manager || '')}</div>
${prev ? `<div class="notif-reply-prev">이전 답글: ${escapeHtml(truncate(prev.content || '', 30))}</div>` : ''}
${curr ? `<div class="notif-reply-curr">${isAwaiting ? '내 답글' : '현재 답글'}: ${escapeHtml(truncate(curr.content || '', 30))}</div>` : ''}
</div>
</div>
`;
}).join('');
return `
<div class="notif-post-card">
<div class="top-line"><span class="material-badge" style="font-size:11px;padding:1px 8px;">${escapeHtml(p.materialName || '')}</span> ${escapeHtml(fmtTime(p.createdAt))}</div>
<div class="headline">${escapeHtml(truncate(p.summary || p.title || '', 36))}</div>
<div class="notif-reply-list">${rowsHtml}</div>
</div>
`;
}).join('');
}

// 2026-10-23: 왼쪽 '시황 뉴스' 메뉴를 눌렀을 때만 — 끼워 넣은 지난 게시물 중 담당 확인이 모두 끝난 글은 목록에서 뺀다.
// 확인이 안 끝난 글은 원래 피드에도 나오는 글이라 그대로 둔다(feedResponses.js 79~83행 규칙과 같음). 서버는 다시 부르지 않는다.
// 알림·고정 댓글 이동(goToItem·goToComment)은 계속 switchView('feed')를 써서 이 정리를 거치지 않는다.
function openFeedMenu_() {
let changed = false;
if (feedInjectedIds_.size) {
feedState.posts = feedState.posts.filter(function (p) {
const id = String(p.id);
if (!feedInjectedIds_.has(id)) return true;
const allConfirmed = (p.items || []).every(function (it) { return it.confirmed; });
if (!allConfirmed) return true;
feedInjectedIds_.delete(id);
changed = true;
return false;
});
}
switchView('feed');
if (changed) renderFeed();
}
function goToPost(postId) {
  switchView('feed');
  setTimeout(() => {
    const el = document.getElementById('post-' + postId);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }, 50);
}

// C. 알림함 "확인 완료 · 댓글 필요" 섹션 — 품목(스레드) 단위 클릭 타겟.
// 게시물로 스크롤한 뒤, 해당 품목 행으로 다시 스크롤하고 스레드가 닫혀있으면 열어준다.
function goToItem(postId, itemId) {
  switchView('feed');
  setTimeout(async () => {
    const key = postId + '-' + itemId;

    // 팀 필터/검색어가 걸려 있으면 대상 게시물이 렌더링에서 제외되어 row가 안 만들어질 수 있으므로 먼저 해제
    let filtersCleared = false;
    if (feedState.teamFilter) {
      feedState.teamFilter = '';
      const teamSelectEl = document.getElementById('team-label');
      if (teamSelectEl && teamSelectEl.tagName === 'SELECT') teamSelectEl.value = '';
      filtersCleared = true;
    }
    if (feedState.searchQuery) {
      feedState.searchQuery = '';
      const searchInputEl = document.getElementById('search-input');
      if (searchInputEl) searchInputEl.value = '';
      const clearBtnEl = document.getElementById('search-clear-btn');
      if (clearBtnEl) clearBtnEl.classList.remove('show');
      filtersCleared = true;
    }
    if (filtersCleared) renderFeed();

    let row = document.getElementById('row-' + key);
    if (!row) {
      const existsInFeed = feedState.posts.some(function (p) { return p.id === postId; });
      if (!existsInFeed) {
        let res = null;
        let __gpCloudOk = false;
        const __gpT0 = Date.now();
        if (CLOUD_RUN_GET_POST_BY_ID_URL) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
            const cloudRes = await fetch(CLOUD_RUN_GET_POST_BY_ID_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionToken: session ? session.sessionToken : null, postId: postId }),
              signal: controller.signal
            }).then(function (r) { return r.json(); });
            clearTimeout(timeoutId);
            const trustedFailure = cloudRes && (cloudRes.error === 'NOT_FOUND' || cloudRes.error === 'FORBIDDEN' || cloudRes.error === 'MISSING_POST_ID');
            if (cloudRes && (cloudRes.ok === true || trustedFailure)) {
              res = cloudRes;
              __gpCloudOk = true;
            }
          } catch (e) {}
        }
        if (__gpCloudOk) {
          console.log('[getPostById] source=cloud-run clientMs=' + (Date.now() - __gpT0));
        } else {
          try {
            res = await callApi('getPostById', { postId: postId });
          } catch (e) {
            res = null;
          }
          console.log('[getPostById] source=apps-script clientMs=' + (Date.now() - __gpT0));
        }
        if (res && res.ok && res.post) {
          feedState.posts.unshift(res.post);
          feedInjectedIds_.add(String(res.post.id));
          renderFeed();
        } else {
          return;
        }
      }
      row = document.getElementById('row-' + key);
      if (!row) return;
    }
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1600);
    const st = threadState[key] || (threadState[key] = { open: false, replyOpenFor: null });
    if (!st.open) {
      toggleThread(postId, itemId);
    } else if (session.role !== '담당') {
      markThreadSeenLocal(postId, itemId);
    }
  }, 50);
}

// 댓글 고정(Pin Comment) 신규 기능 — 고정 영역 클릭 시 해당 댓글까지 이동한다.
// goToItem()과 동일한 필터 해제/미로딩 게시물 조회 로직을 그대로 따라가되(기존 goToItem을
// 수정하지 않고 새 함수로 완전히 분리), 스레드가 열려있지 않으면 toggleThread()의 완료를
// 실제로 기다린 뒤(댓글 목록 fetch가 끝난 뒤) 특정 댓글 엘리먼트로 다시 스크롤+깜빡임한다
// (goToItem은 fire-and-forget이라 그 완료를 기다릴 수 없어 그대로 재사용하지 않았다).
function goToComment(postId, itemId, commentId) {
  switchView('feed');
  setTimeout(async () => {
    const key = postId + '-' + itemId;

    let filtersCleared = false;
    if (feedState.teamFilter) {
      feedState.teamFilter = '';
      const teamSelectEl = document.getElementById('team-label');
      if (teamSelectEl && teamSelectEl.tagName === 'SELECT') teamSelectEl.value = '';
      filtersCleared = true;
    }
    if (feedState.searchQuery) {
      feedState.searchQuery = '';
      const searchInputEl = document.getElementById('search-input');
      if (searchInputEl) searchInputEl.value = '';
      const clearBtnEl = document.getElementById('search-clear-btn');
      if (clearBtnEl) clearBtnEl.classList.remove('show');
      filtersCleared = true;
    }
    if (filtersCleared) renderFeed();

    let row = document.getElementById('row-' + key);
    if (!row) {
      const existsInFeed = feedState.posts.some(function (p) { return p.id === postId; });
      if (!existsInFeed) {
        let res = null;
        if (CLOUD_RUN_GET_POST_BY_ID_URL) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
            const cloudRes = await fetch(CLOUD_RUN_GET_POST_BY_ID_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionToken: session ? session.sessionToken : null, postId: postId }),
              signal: controller.signal
            }).then(function (r) { return r.json(); });
            clearTimeout(timeoutId);
            const trustedFailure = cloudRes && (cloudRes.error === 'NOT_FOUND' || cloudRes.error === 'FORBIDDEN' || cloudRes.error === 'MISSING_POST_ID');
            if (cloudRes && (cloudRes.ok === true || trustedFailure)) res = cloudRes;
          } catch (e) {}
        }
        if (!res) {
          try { res = await callApi('getPostById', { postId: postId }); } catch (e) { res = null; }
        }
        if (res && res.ok && res.post) {
          feedState.posts.unshift(res.post);
          feedInjectedIds_.add(String(res.post.id));
          renderFeed();
        } else {
          return;
        }
      }
      row = document.getElementById('row-' + key);
      if (!row) return;
    }

    const st = threadState[key] || (threadState[key] = { open: false, replyOpenFor: null });
    if (!st.open) {
      await toggleThread(postId, itemId);
    } else if (session.role !== '담당') {
      markThreadSeenLocal(postId, itemId);
    }

    const el = document.getElementById('comment-' + commentId) || row;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }, 50);
}

// 2026-10-23: '지난 게시물 · 9.28' 표시용 날짜(월.일). 날짜를 못 읽으면 빈 글자.
function fmtShortDate_(v) {
const d = new Date(v);
return isNaN(d.getTime()) ? '' : (d.getMonth() + 1) + '.' + d.getDate();
}
function renderPost(post) {
const items = post.items || [];
const itemsHtml = items.map(item => renderItemRow(post, item)).join('');
const allConfirmed = items.length > 0 && items.every(function (item) { return item.confirmed; });
return `
<div class="post-card${allConfirmed ? ' all-confirmed' : ''}" id="post-${post.id}">
<div class="post-head">
<div class="bot-icon"><img src="bot-icon.png" alt=""></div>
<span class="material-badge">${escapeHtml(post.materialName || '')}</span>
<div class="bot-name">AI 시황봇</div>
${feedInjectedIds_.has(String(post.id)) ? `<span class="old-post-tag" title="알림에서 열어 잠깐 보여주는 지난 게시물이에요. 왼쪽 '시황 뉴스' 메뉴를 누르면 목록에서 빠져요.">🕘 지난 게시물 · ${escapeHtml(fmtShortDate_(post.createdAt))}</span>` : ''}
<span class="post-time">${escapeHtml(fmtTime(post.createdAt))}</span>
</div>
<div class="post-title">${escapeHtml(post.summary || '')}</div>
<button type="button" class="report-prompt-btn" id="report-prompt-btn-${post.id}" data-default="📝 AI 보고서 프롬프트 생성" onclick="generateReportPrompt('${post.id}')">📝 AI 보고서 프롬프트 생성</button>
<div class="report-prompt-panel" id="report-prompt-panel-${post.id}" style="display:none;"></div>
<div class="post-summary">${escapeHtml(post.title || '')}</div>
${post.link ? `<a class="article-link" href="${escapeHtml(post.link)}" target="_blank" rel="noopener">🔗 기사 원문 보기</a>` : ''}
<div class="items-box">
<div class="items-box-head">📊 이 원자재를 쓰는 품목 ${items.length}건 · 확인 ${post.confirmedCount || 0}/${post.totalCount || items.length}</div>
${itemsHtml}
</div>
</div>
`;
}

// 2026-09-04: [AI 보고서 프롬프트 생성] 게시물별로 생성된 프롬프트를 메모리에 캐싱해,
// 같은 게시물을 다시 열어봐도(또는 다른 사람이 이미 만들어놨어도 이 세션 안에서는) 불필요한
// AI 재호출을 하지 않는다. 새로고침하면 비워지는 세션 한정 캐시이며, 서버 쪽 캐싱은 아니다.
const reportPromptCache_ = {};

// 2026-09-04: [패널 열림/닫힘 버그 수정] renderFeed()는 폴링(pollForUpdates, 30초 주기)으로 댓글 수 등이
// 바뀌면 피드 전체를 처음부터 다시 그리는데, 그러면 report-prompt-panel도 기본(닫힘) 상태로 리셋된다.
// generateReportPrompt 타임아웃을 60초로 늘리면서 패널이 열려 있는 시간이 길어져 30초 폴링과 겹치는
// 일이 잦아졌고, "패널이 열리자마자 닫히는" 버그로 나타났다. 기존 threadState/hasOpenComposer()와
// 동일한 패턴으로 두 가지를 추적한다: 지금 생성 중인 postId(생성 중엔 재렌더링 자체를 건너뜀),
// 이미 패널이 열려있는 postId(재렌더링 후 restoreOpenThreads()처럼 다시 열어 복원).
const generatingReportPromptFor_ = new Set();
const reportPromptOpenPostIds_ = new Set();
function hasGeneratingReportPrompt_() {
return generatingReportPromptFor_.size > 0;
}

async function generateReportPrompt(postId) {
const btn = document.getElementById('report-prompt-btn-' + postId);
const panel = document.getElementById('report-prompt-panel-' + postId);
if (!btn || !panel) return;

if (reportPromptCache_[postId]) {
reportPromptOpenPostIds_.add(postId);
renderReportPromptPanel_(postId, reportPromptCache_[postId]);
panel.style.display = 'block';
return;
}

generatingReportPromptFor_.add(postId);
btn.disabled = true;
btn.classList.remove('is-failed');
btn.classList.add('is-loading');
btn.innerHTML = '<span class="mro-spinner-sm"></span>프롬프트 생성 중... (최대 1~2분 정도 걸릴 수 있어요)';
try {
// 주의: generateReportPrompt는 RETRYABLE_API_ACTIONS에 절대 넣지 않는다 — AI 호출은
// 조회보다 오래 걸려서, hedge를 적용하면 suggestMaterials와 같은 중복 호출 문제가 재발한다.
const res = await callApi('generateReportPrompt', { postId: postId });
if (res.ok && res.prompt) {
reportPromptCache_[postId] = res.prompt;
reportPromptOpenPostIds_.add(postId);
renderReportPromptPanel_(postId, res.prompt);
panel.style.display = 'block';
btn.disabled = false;
btn.classList.remove('is-loading', 'is-failed');
btn.textContent = btn.dataset.default;
} else {
btn.disabled = false;
btn.classList.remove('is-loading');
btn.classList.add('is-failed');
btn.textContent = '⚠️ 생성 실패 - 다시 시도';
}
} catch (e) {
btn.disabled = false;
btn.classList.remove('is-loading');
btn.classList.add('is-failed');
btn.textContent = '⚠️ 생성 실패 - 다시 시도';
} finally {
generatingReportPromptFor_.delete(postId);
}
}

// renderFeed()가 피드 전체를 다시 그린 뒤, 이미 열려 있던 report-prompt-panel들을 캐시된 내용으로
// 복원한다(threadState 기반 restoreOpenThreads()와 동일한 목적).
function restoreOpenReportPrompts_() {
reportPromptOpenPostIds_.forEach(function (postId) {
const cached = reportPromptCache_[postId];
const panel = document.getElementById('report-prompt-panel-' + postId);
if (!cached || !panel) return;
renderReportPromptPanel_(postId, cached);
panel.style.display = 'block';
});
}

function renderReportPromptPanel_(postId, promptText) {
const panel = document.getElementById('report-prompt-panel-' + postId);
if (!panel) return;
panel.innerHTML = `
<div class="report-prompt-panel-head">
<span class="report-prompt-panel-title">생성된 보고서 작성용 프롬프트</span>
<span class="report-prompt-hint">Gemini Canvas에 붙여넣기 권장</span>
</div>
<textarea class="report-prompt-textarea" id="report-prompt-textarea-${postId}" readonly>${escapeHtml(promptText)}</textarea>
<div class="report-prompt-actions">
<button type="button" class="report-prompt-copy-btn" onclick="copyReportPrompt('${postId}')">📋 복사</button>
</div>
<div class="report-prompt-nextstep">💡 Canvas에서 보고서가 완성되면 우측 상단 <b>공유 및 내보내기 → Docs로 내보내기</b>(또는 전체 선택 후 복사)로 이어가세요.</div>
`;
}

function copyReportPrompt(postId) {
const textarea = document.getElementById('report-prompt-textarea-' + postId);
if (!textarea) return;
navigator.clipboard.writeText(textarea.value).then(function () {
const copyBtn = document.querySelector('#report-prompt-panel-' + postId + ' .report-prompt-copy-btn');
if (copyBtn) {
const orig = copyBtn.textContent;
copyBtn.textContent = '✅ 복사됨';
setTimeout(function () { copyBtn.textContent = orig; }, 1500);
}
}).catch(function () {
alert('복사에 실패했어요. 프롬프트 내용을 직접 선택해서 복사해주세요.');
});
}

function renderItemRow(post, item) {
  const checked = !!item.confirmed;
  const key = post.id + '-' + item.itemId;
  return `
    <div>
      <div class="item-row ${checked ? 'checked' : 'unchecked'}" id="row-${key}" onclick="toggleThread('${post.id}', '${item.itemId}')">
        <div class="customer">${escapeHtml(item.customer || '')}</div>
        <div>${escapeHtml(item.itemName || '')}</div>
        <div class="status ${checked ? 'checked' : 'unchecked'}">
          <span class="status-dot">${checked ? '✓' : '○'}</span>
          <span>${escapeHtml(item.manager || '')}</span>
        </div>
      </div>
      <div class="comment-thread" id="thread-${key}"></div>
    </div>
  `;
}

async function toggleThread(postId, itemId) {
  const key = postId + '-' + itemId;
  const panel = document.getElementById('thread-' + key);
  const st = threadState[key] || (threadState[key] = { open: false, replyOpenFor: null });
  const item = findItem(postId, itemId);

  st.open = !st.open;
  panel.classList.toggle('open', st.open);
  if (!st.open) return;

    if (session.role !== '담당') { markThreadSeenLocal(postId, itemId); }

  if (item && !item.confirmed) {
    renderThread(postId, itemId);
    return;
  }

  const pc = postComments[postId];
  if (!pc || !pc.loaded) {
    panel.innerHTML = `<div class="thread-empty">댓글 불러오는 중...</div>`;
    await loadComments(postId);
  }
  renderThread(postId, itemId);
}

function findItem(postId, itemId) {
  const post = findPost(postId);
  if (!post) return null;
  for (const item of (post.items || [])) {
    if (String(item.itemId) === String(itemId)) return item;
  }
  return null;
}

function findPost(postId) {
  return feedState.posts.find(p => String(p.id) === String(postId));
}

async function loadComments(postId) {
  try {
    let res = null;
    let __gcCloudOk = false;
    const __gcT0 = Date.now();
    if (CLOUD_RUN_GET_COMMENTS_URL) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
        const cloudRes = await fetch(CLOUD_RUN_GET_COMMENTS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionToken: session ? session.sessionToken : null, postId: postId }),
          signal: controller.signal
        }).then(function (r) { return r.json(); });
        clearTimeout(timeoutId);
        if (cloudRes && cloudRes.ok === true) {
          res = cloudRes;
          __gcCloudOk = true;
        }
      } catch (e) {}
    }
    if (__gcCloudOk) {
      console.log('[getComments] source=cloud-run clientMs=' + (Date.now() - __gcT0));
    } else {
      res = await callApi('getComments', { postId });
      console.log('[getComments] source=apps-script clientMs=' + (Date.now() - __gcT0));
    }
    if (!res.ok) {
      postComments[postId] = { loaded: true, comments: [], error: res.error };
      return;
    }
    postComments[postId] = { loaded: true, comments: res.comments || [] };
  } catch (e) {
    postComments[postId] = { loaded: true, comments: [], error: 'NETWORK_ERROR' };
  }
}

function canStartFirstComment(item) {
  if (!session || !item) return false;
  return session.role === '담당' && String(item.manager || '').trim() === String(session.name || '').trim();
}
function canReply() {
  return session && (session.role === '담당' || session.role === '팀장' || session.role === '임원');
}
// 댓글 고정(Pin Comment) 신규 기능 — 고정/해제 권한은 팀장·임원(최대 3개 전역 공유 한도).
// 본인 댓글 여부와 무관하게 동일하게 적용된다(설계 문서 확정 사항).
function canPin() {
  return !!(session && (session.role === '팀장' || session.role === '임원'));
}
function roleClass(role) {
  if (role === '담당') return 'role-담당';
  if (role === '팀장') return 'role-팀장';
  if (role === '임원') return 'role-임원';
  return 'role-담당';
}

function renderThread(postId, itemId) {
  const key = postId + '-' + itemId;
  const panel = document.getElementById('thread-' + key);
  // 댓글 고정(Pin Comment) 신규 기능 — 고정 영역의 "해제" 버튼은 해당 스레드를 한 번도 열어보지
  // 않은 상태에서도 호출될 수 있어(thread-${key} 패널이 아직 DOM에 없을 수 있음), 패널이 없으면
  // 조용히 아무 것도 하지 않는다(기존에는 이 경우를 부르는 호출부가 없어 방어코드가 없었다).
  if (!panel) return;
  const item = findItem(postId, itemId);
  const pc = postComments[postId] || { comments: [] };
  const comments = (pc.comments || []).filter(c => String(c.itemId) === String(itemId));

  if (pc.error) {
    panel.innerHTML = `<div class="thread-error">댓글을 불러오지 못했어요. (${escapeHtml(pc.error)})</div>`;
    return;
  }

  if (!comments.length) {
    const startBtn = canStartFirstComment(item)
      ? `<button class="first-comment-btn" onclick="openReplyBox('${postId}', '${itemId}', null)">첫 댓글 남기기</button>
         <div id="composer-${key}-root" class="first-comment-form"></div>`
      : '';
    panel.innerHTML = `<div class="thread-empty">아직 확인 댓글이 없어요.</div>${startBtn}`;
    return;
  }

  const byId = {}; comments.forEach(c => byId[c.commentId] = c);
  function depthOf(c) {
    let d = 0, cur = c;
    while (cur && cur.parentCommentId && byId[cur.parentCommentId]) { d++; cur = byId[cur.parentCommentId]; if (d > 8) break; }
    return d;
  }

  const html = comments.map(c => {
    const depth = depthOf(c);
    const parent = c.parentCommentId ? byId[c.parentCommentId] : null;
    const isMine = !!(session && session.email && c.authorEmail && String(c.authorEmail).toLowerCase() === String(session.email).toLowerCase());
    const replyBtn = canReply()
      ? `<button class="comment-reply-btn" onclick="openReplyBox('${postId}', '${itemId}', '${c.commentId}')">답장</button>`
      : '';
    const editBtn = isMine
      ? `<button class="comment-edit-btn" onclick="startEditComment('${postId}', '${itemId}', '${c.commentId}')">수정</button>`
      : '';
    const deleteBtn = isMine
      ? `<button class="comment-delete-btn" onclick="deleteCommentConfirm('${postId}', '${itemId}', '${c.commentId}')">삭제</button>`
      : '';
    // 댓글 고정(Pin Comment) 신규 기능 — 답장/수정/삭제와 구분되는 별도 권한(팀장·임원)이라
    // 얇은 구분선 뒤에 붙인다(목업 확정 레이아웃과 동일). 본인 댓글 여부와 무관하게 노출된다.
    const pinned = (typeof isPinned_ === 'function') && isPinned_(c.commentId);
    const pinPending = (typeof pinningInFlight !== 'undefined') && pinningInFlight.has(c.commentId);
    // 목업(Main.dc.html)과 동일한 아이콘: 미고정 버튼은 윤곽선 핀, 고정됨 라벨은 채워진 핀.
    const PIN_ICON_OUTLINE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14l-1.4-1.4A3 3 0 0 1 17 13.6V8a5 5 0 0 0-10 0v5.6a3 3 0 0 1-.6 2L5 17z"></path></svg>';
    const PIN_ICON_FILLED = '<svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="1"><line x1="12" y1="17" x2="12" y2="22" stroke-width="2.4" stroke-linecap="round"></line><path d="M5 17h14l-1.4-1.4A3 3 0 0 1 17 13.6V8a5 5 0 0 0-10 0v5.6a3 3 0 0 1-.6 2L5 17z"></path></svg>';
    let pinBtn = '';
    if (!(c.pending || c.deleting) && canPin()) {
      if (pinned) {
        pinBtn = `<span class="comment-pin-divider"></span><span class="comment-pinned-label">${PIN_ICON_FILLED}고정됨</span><button class="comment-unpin-btn"${pinPending ? ' disabled' : ''} onclick="unpinComment('${postId}', '${itemId}', '${c.commentId}')">${pinPending ? '처리 중...' : '해제'}</button>`;
      } else {
        pinBtn = `<span class="comment-pin-divider"></span><button class="comment-pin-btn"${pinPending ? ' disabled' : ''} onclick="pinComment('${postId}', '${itemId}', '${c.commentId}')">${pinPending ? '처리 중...' : PIN_ICON_OUTLINE + '고정'}</button>`;
      }
    }
    return `
      <div class="comment-item${c.pending ? ' pending' : ''}${c.deleting ? ' pending' : ''}${pinned ? ' pinned-highlight' : ''}" id="comment-${c.commentId}" style="margin-left:${depth * 24}px;">
        <div class="avatar ${roleClass(c.authorRole)}">${escapeHtml(initials(c.authorName))}</div>
        <div class="comment-body">
          ${parent ? `<div class="reply-to">↳ ${escapeHtml(parent.authorName)} ${escapeHtml(parent.authorRole || '')}에게 답장</div>` : ''}
          <div class="comment-head">
            <span class="role">${escapeHtml(c.authorRole || '')}</span>${!parent ? `<span class="role">· 최초 댓글</span>` : ''}<span class="time">· ${c.pending ? '전송 중...' : (c.deleting ? '삭제 중...' : escapeHtml(fmtTime(c.createdAt)))}</span>
          </div>
          <div class="comment-text" id="text-${c.commentId}">${escapeHtml(c.content)}</div>
          ${(c.pending || c.deleting) ? '' : `<div class="comment-actions">${replyBtn}${editBtn}${deleteBtn}${pinBtn}</div>`}
          <div id="composer-${key}-${c.commentId}"></div>
        </div>
      </div>
    `;
  }).join('');

  panel.innerHTML = html;
}

function openReplyBox(postId, itemId, parentCommentId) {
  const key = postId + '-' + itemId;
  const st = threadState[key];
  if (st.replyOpenFor === (parentCommentId || 'root')) {
    st.replyOpenFor = null;
    renderThread(postId, itemId);
    return;
  }
  st.replyOpenFor = parentCommentId || 'root';
  renderThread(postId, itemId);

  const mountId = parentCommentId ? `composer-${key}-${parentCommentId}` : `composer-${key}-root`;
  const mount = document.getElementById(mountId);
  if (!mount) return;
  mount.innerHTML = `
    <div class="reply-composer">
      <textarea id="ta-${key}" placeholder="${parentCommentId ? '답장을 입력하세요' : '확인 내용을 입력하세요'}"></textarea>
      <button id="btn-send-${key}" onclick="submitComment('${postId}', '${itemId}', ${parentCommentId ? `'${parentCommentId}'` : 'null'})">등록</button>
    </div>
  `;
  document.getElementById('ta-' + key).focus();
}

async function submitComment(postId, itemId, parentCommentId) {
  const key = postId + '-' + itemId;
  const ta = document.getElementById('ta-' + key);
  const btn = document.getElementById('btn-send-' + key);
  const content = ta.value.trim();
  if (!content) { ta.focus(); return; }

  btn.disabled = true; btn.textContent = '등록 중...';

  const tempId = 'temp-' + Date.now();
  const optimisticComment = {
    commentId: tempId,
    postId: postId,
    itemId: itemId,
    authorEmail: session.email || '',
    authorName: session.name,
    authorRole: session.role,
    parentCommentId: parentCommentId || '',
    content: content,
    createdAt: new Date().toISOString(),
    pending: true
  };
  if (!postComments[postId]) postComments[postId] = { loaded: true, comments: [] };
  postComments[postId].comments = (postComments[postId].comments || []).concat([optimisticComment]);
  const st = threadState[key];
  st.replyOpenFor = null;
  renderThread(postId, itemId);

  try {
    // postComment 2단계(2026-08-21, 설계 승인 완료): CLOUD_RUN_POSTCOMMENT_URL이 채워져 있으면
    // postCommentRemote_()의 3단 폴백 정책(사전 실패/애매한 실패/최종 실패)을 먼저 시도하고,
    // 비어 있으면(롤백 상태) 기존 Apps Script 경로를 그대로 쓴다 — markThreadSeen과 동일한
    // "빈 문자열로 롤백" 스위치 패턴.
    const res = (await postCommentRemote_(postId, itemId, content, parentCommentId))
      || await callApi('postComment', { postId, itemId, content, parentCommentId });
    if (!res.ok) {
      if (res.error === 'AMBIGUOUS_NEEDS_CONFIRMATION') {
        // 설계 문서 3-3: 서버가 실제로 처리했을 수도 있는 애매한 실패라 임시 댓글을 지우지
        // 않는다(지우면 실제로는 등록된 댓글이 화면에서 사라진 것처럼 보여 재시도를 유도하고,
        // 그 재시도가 진짜 중복 등록으로 이어질 위험이 있음). Apps Script로도 자동 전달하지 않음.
        renderThread(postId, itemId);

        btn.disabled = false; btn.textContent = '등록';

      postComments[postId].comments = postComments[postId].comments.filter(c => c.commentId !== tempId);
      renderThread(postId, itemId);
      alert(res.error === 'FORBIDDEN_VIEWER' ? '이 작업을 수행할 권한이 없어요.' : ('오류가 발생했어요 (' + res.error + ')'));

    if (res.comments) {

    }
    if (res.updatedPost) {
      const idx = feedState.posts.findIndex(p => String(p.id) === String(postId));

    }
        /* v26: 여기서 markThreadSeenLocal을 호출하지 않는다 - 예전에는 댓글 등록 직후 무조건 호출해서, 팀장/임원이 남긴 답변이 만든 '답변 요청' 상태가 등록과 동시에 사라지는 문제가 있었다(hasAwaitingReply 참고). '댓글 필요'(hasUnreadReply)는 이 호출이 없어도 문제없다 - 방금 내가 마지막 댓글 작성자가 됐으므로 그 함수 안에서 이미 자동으로 꺼진다. 스레드 '확인' 처리는 실제로 스레드를 열어보는 시점(toggleThread, 알림 클릭 이동)에만 한다. */
        renderFeed();

// 2026-10-19: 댓글 수정 입력창 높이를 글 길이에 맞춘다(최대 화면 높이의 절반, 넘으면 입력창 안에서 스크롤).
function autoSizeEditTextarea_(ta) {

try {
let res;
const __gsT0 = Date.now();
let __gsCloudOk = false;
if (CLOUD_RUN_GET_SETTINGS_URL) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function () { controller.abort(); }, 20000);
    const cloudRes = await fetch(CLOUD_RUN_GET_SETTINGS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionToken: session ? session.sessionToken : null }), signal: controller.signal }).then(function (r) { return r.json(); });
    clearTimeout(timeoutId);
    if (cloudRes && cloudRes.ok) { res = cloudRes; __gsCloudOk = true; }
  } catch (e) {}
}
if (__gsCloudOk) {
  console.log('[getSettings] source=cloud-run clientMs=' + (Date.now() - __gsT0));
} else {
  res = await callApi('getSettings', {});

function renderSettingsPage(settings, descriptions, categories) {
const root = document.getElementById('settings-view');
// categories가 없으면(Apps Script 대체 경로 — 구분을 보내지 않음) 예전처럼 전체를 한 화면에 보여준다.
const hasCategories = !!categories && typeof categories === 'object';
const wantCommon = settingsCategory_ === '공통';
const shownKeys = Object.keys(settings).filter(function (key) {
if (!hasCategories) return true;
return (String(categories[key] || '').trim() === '공통') === wantCommon;
});
const titleHtml = `<div class="settings-row-title" style="font-size:16px; margin:0 0 12px;">${wantCommon ? '공통 설정' : '시황 설정'}</div>`
+ (hasCategories ? '' : `<div class="form-hint" style="margin:0 0 12px;">구분 정보를 받지 못해 전체 설정을 한 화면에 보여줍니다.</div>`);
const rowsHtml = shownKeys.map(function (key) {
const meta = SETTINGS_META[key] || { label: key, desc: '' };
const desc = (descriptions && descriptions[key]) || meta.desc || '';
return `
<div class="settings-row">
<div class="settings-row-label">
<div class="settings-row-title">${escapeHtml(meta.label)}</div>
${desc ? `<div class="settings-row-desc">${escapeHtml(desc)}</div>` : ''}
</div>
<input type="text" class="form-input settings-row-input" data-key="${escapeHtml(key)}" value="${escapeHtml(String(settings[key]))}">
</div>
`;
}).join('');
root.innerHTML = `
<div class="settings-panel">
${titleHtml}
${rowsHtml}
<div id="settings-save-msg" class="form-hint" style="margin:10px 0;"></div>
<div class="item-form-actions">
<button class="btn-primary" onclick="saveSettingsPage()">저장</button>
</div>
</div>
`;
}

async function saveSettingsPage() {
const inputs = document.querySelectorAll('.settings-row-input');
const updates = {};
inputs.forEach(function (input) {
updates[input.dataset.key] = input.value;
});
const msg = document.getElementById('settings-save-msg');
msg.textContent = '저장 중...';
try {
// updateSettings Cloud Run 배선(설계 승인 완료 — USERMGMT_CLOUDRUN_DESIGN.md):
// CLOUD_RUN_UPDATE_SETTINGS_URL이 채워져 있으면 updateSettingsRemote_()의 3단 폴백 정책을
// 먼저 시도하고, 비어 있으면(롤백 상태) 기존 Apps Script 경로를 그대로 쓴다 — upsertItem과
// 동일한 "빈 문자열로 롤백" 스위치 패턴.
const res = (await updateSettingsRemote_({ settings: updates }))
  || await callApi('updateSettings', { settings: updates });
if (!res.ok) {
if (res.error === 'AMBIGUOUS_NEEDS_CONFIRMATION') {
  msg.textContent = '저장 여부를 확인할 수 없습니다. 새로고침 후 확인해주세요.';
  return;
}
msg.textContent = '저장 실패: ' + (res.error || 'SERVER_ERROR');
return;
}
msg.textContent = '저장됐어요.';
} catch (e) {
msg.textContent = '네트워크 오류가 발생했어요.';
}
}

function compRateLimit_(res) {
if (res && res.ok === false && (/quota exceeded|rate ?limit|resource_exhausted/i.test(String(res.error || '')) || (res.error === 'SHEET_ACCESS_FAILED' && Number(res.httpStatus) === 429))) res.error = 'RATE_LIMITED';
