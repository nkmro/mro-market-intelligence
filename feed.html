}
function compErrorText_(res, what) {
if (!res) return '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';
if (res.error === 'RATE_LIMITED') return COMP_RATE_TEXT_;
if (res.error === 'COMPETENCY_SETTINGS_MISSING') return (res.year || '올해') + '년 인사평가 파일이 아직 등록되지 않았어요. 관리자에게 알려 주세요.';
if (res.error === 'SHEET_ACCESS_FAILED') return '인사평가 파일을 읽지 못했어요. 잠시 후 다시 시도해 주세요.';
if (res.error === 'SESSION_EXPIRED' || res.error === 'SESSION_NOT_FOUND') return '로그인이 만료됐어요. 다시 로그인해 주세요.';
if (res.error === 'FORBIDDEN' || res.error === 'USER_NOT_FOUND') return '이 화면을 볼 권한이 없어요.';
return (what || '기준') + '을 불러오지 못했어요. (' + (res.error || 'SERVER_ERROR') + ')';
}

// 고치기·저장은 2단계(saveCompetencyTest action updateSettings). 그 전에는 시트에서 직접 고친다.
const COMP_SETTING_ROWS_ = [

function compSettingRowHtml_(title, desc, valHtml) {
return `<div class="settings-row"><div class="settings-row-label"><div class="settings-row-title">${escapeHtml(title)}</div>${desc ? `<div class="settings-row-desc">${escapeHtml(desc)}</div>` : ''}</div><div class="cs-val">${valHtml}</div></div>`;

}).join('');
const tabs = Array.isArray(res.tabs) ? res.tabs : [];

}).join('');

const used = COMP_SETTING_ROWS_.map(function (m) { return m.key; }).concat(tabs.map(function (t) { return '탭이모지_' + t.label; }));
const extra = order.filter(function (k) { return used.indexOf(k) < 0; }).map(function (k) { return compSettingRowHtml_(k, '', map[k] ? escapeHtml(map[k]) : none('')); }).join('');
root.innerHTML = `<div class="settings-panel">

// (PIN_COMMENT_CLOUDRUN_DESIGN.md 승인 확정, 2026-09-11). 팀장/임원이 중요 댓글을 최대

// (pinnedComments)만 쓰고 기존 시트/컬렉션은 읽기만 하므로 기존 기능에 영향이 없다.

// 2026-10-29 요금 절감: 고정 댓글을 마지막으로 성공해서 받은 시각(화면 복귀 시 10분 지났으면 다시 받음).

// pin/unpin 실패 사유를 사람이 읽을 수 있는 문구로 변환한다(재홍님 코드 리뷰 지적 반영 —
// 이전에는 PIN_LIMIT_REACHED 외의 실패(권한 없음, 댓글 삭제됨, 네트워크 오류 등)가 아무
// 피드백 없이 조용히 무시됐다).
function pinErrorMessage_(error) {
  const map = {
    'PIN_LIMIT_REACHED': '최대 3개까지 고정 가능해요! 다른 것을 삭제해주세요!',
    'FORBIDDEN_NOT_LEAD_OR_EXEC': '팀장/임원만 고정할 수 있어요.',
    'COMMENT_NOT_FOUND': '댓글을 찾을 수 없어요.',
    'MISSING_FIELDS': '필수 정보가 누락됐어요.',
    'MISSING_COMMENT_ID': '댓글 정보가 누락됐어요.',
    'USER_NOT_FOUND': '사용자 정보를 찾을 수 없어요.',
    'FEATURE_DISABLED': '이 기능은 현재 사용할 수 없어요.',
    'NETWORK_ERROR': '네트워크 오류가 발생했어요.'
  };
  return map[error] || ('고정 처리 실패: ' + error);
}

function isPinned_(commentId) {
  return pinnedState.items.some(function (p) { return p.commentId === commentId; });
}

async function loadPinnedComments() {
  try {
    const res = await getPinnedCommentsRemote_();
    pinnedState.items = (res && res.ok && Array.isArray(res.pinnedComments)) ? res.pinnedComments : [];
    if (res && res.ok) pinnedLastOkAt = Date.now();
  } catch (e) {
    pinnedState.items = [];
  }
  pinnedState.loaded = true;
  renderPinnedArea();
}

// 목업(Main.dc.html)의 스파크 애니메이션 핀 아이콘 SVG — 그대로 재사용.
const PIN_SPARK_ICON_SVG = '<svg class="pinned-icon" width="20" height="20" viewBox="-6 -6 36 36" fill="none" stroke="var(--danger)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line class="pin-body" x1="12" y1="17" x2="12" y2="22"></line><path class="pin-body" d="M5 17h14l-1.4-1.4A3 3 0 0 1 17 13.6V8a5 5 0 0 0-10 0v5.6a3 3 0 0 1-.6 2L5 17z"></path><g stroke-width="2.2"><line class="spark spark-1" x1="22" y1="2" x2="26" y2="-2"></line><line class="spark spark-2" x1="22" y1="22" x2="26" y2="26"></line><line class="spark spark-3" x1="2" y1="22" x2="-2" y2="26"></line><line class="spark spark-4" x1="2" y1="2" x2="-2" y2="-2"></line></g></svg>';

function renderPinnedArea() {
  const root = document.getElementById('pinned-area');
  if (!root) return;
  try {
    if (!pinnedState.items.length) { root.innerHTML = ''; return; }
    const rowsHtml = pinnedState.items.map(function (p) {
      const pending = pinningInFlight.has(p.commentId);
      const unpinBtn = canPin()
        ? `<button class="pinned-unpin-btn"${pending ? ' disabled' : ''} onclick="event.stopPropagation(); unpinComment('${p.postId}', '${p.itemId || ''}', '${p.commentId}')">${pending ? '처리 중...' : '해제'}</button>`
        : '';
      // 2026-09-14: "원자재명 (이름 역할) : 내용" 형식으로 변경 - 이슈 댓글 목록은 여러 게시물을
      // 넘나들기 때문에 "어떤 원자재 이슈인지"가 먼저 보여야 한다는 재홍님 피드백 반영. materialName이
      // 없는 예외적인 경우(백엔드에서 게시물을 못 찾은 경우)는 원자재명 부분 없이 자연스럽게 폴백.
      const materialHtml = p.materialName
        ? `<span class="pinned-material">${escapeHtml(p.materialName)}</span> `
        : '';
      return `
        <div class="pinned-item">
          ${PIN_SPARK_ICON_SVG}
          <div class="pinned-text-row" onclick="goToComment('${p.postId}', '${p.itemId || ''}', '${p.commentId}')">
            ${materialHtml}<span class="pinned-author">(${escapeHtml(p.authorName || '')} ${escapeHtml(p.authorRole || '')})</span><span class="pinned-sep"> : </span><span>${escapeHtml(p.contentSnapshot || '')}</span>
          </div>
          ${unpinBtn}
        </div>
      `;
    }).join('');
    // 재홍님 요청 반영(2026-09-14): "최대 3개까지 고정할 수 있어요 (n/3)" 상시 안내 문구는
    // 제거 — 대신 3개 한도에 실제로 걸렸을 때만 pinComment()의 PIN_LIMIT_REACHED 알림으로
    // 안내한다(아래 pinErrorMessage_ 참고).
    const titleHtml = `<div class="pinned-area-title">📌 이슈 댓글</div>`;
    root.innerHTML = titleHtml + rowsHtml;
  } catch (e) {
    // 고정 영역 렌더링 실패는 이 영역만 비우고 기존 피드/댓글에는 영향을 주지 않는다.
    root.innerHTML = '';
  }
}

async function pinComment(postId, itemId, commentId) {
  if (!canPin() || pinningInFlight.has(commentId)) return;
  pinningInFlight.add(commentId);
  renderThread(postId, itemId);
  renderPinnedArea();
  try {
    const res = await pinCommentRemote_(postId, itemId, commentId);
    if (res && res.ok) {
      await loadPinnedComments(); // renderPinnedArea()까지 포함
    } else if (res && res.error) {
      // PIN_LIMIT_REACHED뿐 아니라 모든 실패 사유에 대해 피드백을 준다(재홍님 코드 리뷰 지적 반영).
      alert(pinErrorMessage_(res.error));
    }
  } catch (e) {
    alert('네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    pinningInFlight.delete(commentId);
    renderThread(postId, itemId);
    renderPinnedArea();
  }
}

async function unpinComment(postId, itemId, commentId) {
  if (!canPin() || pinningInFlight.has(commentId)) return;
  pinningInFlight.add(commentId);
  renderThread(postId, itemId);
  renderPinnedArea();
  try {
    const res = await unpinCommentRemote_(commentId);
    if (res && res.ok) {
      await loadPinnedComments(); // renderPinnedArea()까지 포함
    } else if (res && res.error) {
      alert(pinErrorMessage_(res.error));
    }
  } catch (e) {
    alert('네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    pinningInFlight.delete(commentId);
    renderThread(postId, itemId);
    renderPinnedArea();
  }
}

async function loadItems(isRetry) {
const root = document.getElementById('items-view');
// 이미 한번 불러온 적이 있으면(=백그라운드 복귀 등으로 인한 조용한 갱신) 화면을 비우지 않고
// 기존 목록을 그대로 보여준 채 뒤에서 조용히 새로 받아온다. 데이터 신선도(다른 담당자가
// 그 사이 수정했을 수 있음)는 유지하되, 매번 "불러오는 중..." 화면으로 깜빡이며 기다리게
// 하던 문제를 없앤다. 최초 진입(아직 한번도 못 불러온 경우)에는 기존처럼 로딩 화면을 보여준다.
const isFirstLoad = !itemsState.loaded;
if (isFirstLoad) {
root.innerHTML = `<div class="feed-loading"><span class="mro-spinner"></span>불러오는 중...</div>`;
}
// Promise.all 대신 allSettled 사용: 셋 중 하나가 일시적으로 실패해도
// 나머지가 성공했으면 화면은 정상적으로 띄운다 (구글 앱스 스크립트는 동시 요청에
// 가끔 삐끗할 수 있어, 하나의 실패가 전체를 막아버리지 않도록 하기 위함).
const settled = await Promise.allSettled([
getItemsRemote_(),
getCustomersRemote_(),
getUsersRemote_()
]);
const itemsRes = settled[0].status === 'fulfilled' ? settled[0].value : { ok: false, error: 'NETWORK_ERROR' };
const customersRes = settled[1].status === 'fulfilled' ? settled[1].value : { ok: false };
const usersRes = settled[2].status === 'fulfilled' ? settled[2].value : { ok: false };
if (!itemsRes.ok) {
  // 백그라운드 복귀 직후 네트워크 준비 지연으로 실패했을 수 있어 한번만 자동 재시도
  if (!isRetry) { setTimeout(function () { loadItems(true); }, 1800); return; }
  // 최초 로딩이 아니라 조용한 갱신 중 실패한 거라면, 이미 보여주고 있던 목록을 에러 화면으로
  // 덮어쓰지 않고 그대로 유지한다 (다음 갱신 때 다시 시도됨).
  if (isFirstLoad) {
    root.innerHTML = `<div class="feed-empty">품목 목록을 불러오지 못했어요. (${escapeHtml(itemsRes.error || 'SERVER_ERROR')})</div>`;
  }
  return;
}
itemsState.items = itemsRes.items || [];
itemsState.customers = customersRes.ok ? (customersRes.customers || []) : [];
itemsState.teamUsers = usersRes.ok ? (usersRes.users || []).filter(function (u) {
  // 시트 값에 섞여 들어올 수 있는 공백/형식 차이 때문에 정상적으로 존재하는 담당자가 드롭다운에서
  // 누락되는 문제가 있어(String+trim 없이 비교), 이 프로젝트 전반의 관례대로 공백을 제거하고 비교한다.
  return String(u.team || '').trim() === String(session.team || '').trim()
    && String(u.status || '').trim() === '활성'
    && String(u.role || '').trim() === '담당';
}) : [];
if (!itemsState.loaded) {
itemsState.filterTeam = session.team || '';
}
itemsState.loaded = true;
// 응답을 기다리는 사이 사용자가 이미 다른 탭으로 이동했을 수 있다. 이때 items-view는 display:none이라
// scrollWidth 등 폭 계산이 전부 0으로 나와 상단 스크롤바 폭이 0px로 잘못 확정되는 문제가 실측으로 확인됨.
// 화면이 실제로 보이는 상태일 때만 다시 그린다.
if (currentView === 'items') {
renderItemsView();
}
}

const root = document.getElementById('items-view');
root.innerHTML = `

// 2026-10-12: AI 원자재 추천 Cloud Run 호출(설계 3-1). 반환값:
//   null      → 호출부가 기존 Apps Script 경로(callApi)로 다시 보낸다
//               (URL 비어 있음 / 연결 실패 / 5xx / JSON 아님 / AI_FAILED / LOCK_TIMEOUT)
//   응답 객체 → 그대로 화면에 반영(성공, FORBIDDEN·MISSING_FIELDS·세션 오류 등 명확한 실패,
//               60초 무응답 = { ok:false, error:'TIMEOUT' })
// 재시도는 하지 않는다(AI 중복 호출 방지, 2026-09-04 결정 유지). 요청 번호는 매번 새로 만든다.
// 2026-10-13: 위 "넘길 수 있는 실패"라도, 이 화면에서 요청을 보낸 뒤 30초 이상 지나서 받은 실패면
// Apps Script로 넘기지 않고 { ok:false, error:'SLOW_FAILURE' }("추천 실패 - 다시 시도")로 끝낸다.
// Apps Script 경로도 AI를 다시 불러 15~30초가 걸리므로, 넘기면 사용자가 1분 넘게 기다리게 되기 때문.
// 성공 응답은 몇 초가 걸렸든 그대로 쓴다. 측정 위치 = 이 화면(Cloud Run 시동·네트워크 시간 포함).
const SUGGEST_FALLBACK_ERRORS_ = { AI_FAILED: true, LOCK_TIMEOUT: true };
const SUGGEST_NO_FALLBACK_AFTER_MS = 30000;
async function suggestMaterialsRemote_(itemName) {
  if (!CLOUD_RUN_SUGGEST_MATERIALS_URL) return null;
  const controller = new AbortController();
  const timeoutMs = API_REQUEST_TIMEOUT_MS_BY_ACTION.suggestMaterials || DEFAULT_API_REQUEST_TIMEOUT_MS;
  const timeoutId = setTimeout(function () { controller.abort(); }, timeoutMs);
  const startedAt = Date.now();
  // 넘김 조건에 해당할 때 호출: 30초 안이면 null(넘김), 넘었으면 실패로 끝냄
  function fallbackOrSlowFailure_(reason) {
    const waited = Date.now() - startedAt;
    if (waited >= SUGGEST_NO_FALLBACK_AFTER_MS) {
      console.log('[suggestMaterials] source=cloud-run ' + reason + ' after ' + waited + 'ms -> no fallback (slow)');
      return { ok: false, error: 'SLOW_FAILURE' };
    }
    console.log('[suggestMaterials] source=cloud-run ' + reason + ' after ' + waited + 'ms -> apps-script fallback');
    return null;
  }
  try {
    const res = await fetch(CLOUD_RUN_SUGGEST_MATERIALS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'app',
        sessionToken: session ? session.sessionToken : null,
        idempotencyKey: generateIdempotencyKey_(),
        itemName: itemName
      }),
      signal: controller.signal
    });
    if (res.status >= 500) return fallbackOrSlowFailure_('http=' + res.status);
    let json = null;
    try { json = await res.json(); } catch (parseErr) { json = null; }
    if (!json || typeof json.ok !== 'boolean') return fallbackOrSlowFailure_('http=' + res.status + ' non-json');
    if (!json.ok && SUGGEST_FALLBACK_ERRORS_[json.error]) return fallbackOrSlowFailure_('error=' + json.error);
    console.log('[suggestMaterials] source=cloud-run ok=' + json.ok + (json.ok ? '' : ' error=' + json.error));
    return json;
  } catch (err) {
    if (controller.signal.aborted) {
      console.log('[suggestMaterials] source=cloud-run timeout ' + timeoutMs + 'ms -> no fallback');
      return { ok: false, error: 'TIMEOUT' };
    }
    return fallbackOrSlowFailure_('network error');
  } finally {
    clearTimeout(timeoutId);
  }
}

// 2026-10-12: 대기시간을 60초로 늘리면서, 앞선(느린) 추천 응답이 나중 요청보다 늦게 도착해 최신 결과를
// 덮어쓰는 일을 막는다 — 가장 마지막에 보낸 요청의 응답만 화면에 반영한다.
let suggestMaterialsSeq_ = 0;
async function suggestMaterialsForForm() {
const nameInput = document.getElementById('item-name-input');
if (!nameInput) return;
const itemName = nameInput.value.trim();
if (!itemName) return;
const btn = document.getElementById('ai-suggest-btn');
if (btn) { btn.disabled = true; btn.textContent = '⏳ 추천 받는 중...'; }
const mySeq = ++suggestMaterialsSeq_;
try {
// 2026-10-12: Cloud Run 먼저, null이면(설계 3-1의 넘김 조건) 기존 Apps Script 경로. 그 사이 더 최근
// 요청이 생겼으면 Apps Script로 넘기지 않는다(쓸모없는 AI 호출 방지).
const remoteRes = await suggestMaterialsRemote_(itemName);
if (mySeq !== suggestMaterialsSeq_) return;
const res = remoteRes || await callApi('suggestMaterials', { itemName: itemName });
if (mySeq !== suggestMaterialsSeq_) return; // 더 최근 요청이 있으면 이 응답은 버린다
if (res.ok && res.materials) {
itemsState.selectedMaterials = res.materials;
renderMaterialTags();
// 2026-09-04: 실패 후 재시도 시 btn.textContent를 그대로 재사용하면 "⚠️ 추천 실패 - 다시
// 시도" 문구가 성공 후에도 남는 버그가 있어(직전 상태를 caption으로 캡처했기 때문),
// 렌더링 시 고정해둔 data-default를 원래 문구의 단일 출처로 사용하도록 고쳤다.
if (btn) { btn.disabled = false; btn.textContent = btn.dataset.default; }
} else {
// 2026-09-04: hedge/재시도 제거로 자동 복구가 없어졌으니, 서버가 명시적으로 실패를
// 반환한 경우(예: AI_SUGGEST_FAILED) 조용히 넘어가지 않고 버튼으로 재시도를 유도한다.
if (btn) { btn.disabled = false; btn.textContent = '⚠️ 추천 실패 - 다시 시도'; }
}
} catch (e) {
// 네트워크 오류/타임아웃 등 요청 자체가 실패한 경우도 동일하게 안내.
if (mySeq !== suggestMaterialsSeq_) return;
if (btn) { btn.disabled = false; btn.textContent = '⚠️ 추천 실패 - 다시 시도'; }
}
}

function onCustomerInput() {
const input = document.getElementById('item-customer-input');
const q = input.value.trim();
const box = document.getElementById('customer-suggestions');

if (itemsState.pendingNewCustomerName !== null) {
// 신규 고객사 모드 중 텍스트가 바뀐 경우: 타이핑했다는 사실만으로 무조건 해제하지 않고,
// 현재 텍스트가 '기존 고객사명과 정확히 일치'하는지로만 판단한다.
if (!q) {
itemsState.pendingNewCustomerName = null;
showCustomerCodeField(false);
} else {
const matchesExisting = itemsState.customers.some(function (c) { return c.name === q; });
if (matchesExisting) {
itemsState.pendingNewCustomerName = null;
showCustomerCodeField(false);
} else {
itemsState.pendingNewCustomerName = q; // 신규 모드 유지, 후보 이름만 최신화
}
}
}

if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
const matches = itemsState.customers.filter(function (c) { return c.name.toLowerCase().includes(q.toLowerCase()); }).slice(0, 8);
const exact = itemsState.customers.some(function (c) { return c.name === q; });
let html = matches.map(function (c) {
return `<div class="customer-suggestion-item" onmousedown="selectCustomer('${escapeHtml(c.name).replace(/'/g, "\\'")}')">${escapeHtml(c.name)}</div>`;
}).join('');
if (!exact) {
html += `<div class="customer-suggestion-item add-new" onmousedown="selectNewCustomer('${escapeHtml(q).replace(/'/g, "\\'")}')">+ "${escapeHtml(q)}" 새 고객사로 추가</div>`;
}
box.innerHTML = html;
box.style.display = 'block';
}

function selectCustomer(name) {
itemsState.pendingNewCustomerName = null;
document.getElementById('item-customer-input').value = name;
document.getElementById('customer-suggestions').style.display = 'none';
showCustomerCodeField(false);
}

function selectNewCustomer(name) {
itemsState.pendingNewCustomerName = name;
document.getElementById('item-customer-input').value = name;
document.getElementById('customer-suggestions').style.display = 'none';
showCustomerCodeField(true);
const codeInput = document.getElementById('item-customer-code-input');
if (codeInput) codeInput.focus();
}

async function saveItemForm() {
if (!canEditItems()) return; // 방어: 뷰어 권한(담당)에서는 저장 버튼 자체가 없지만 이중 방어
const customer = document.getElementById('item-customer-input').value.trim();
const itemName = document.getElementById('item-name-input').value.trim();
const manager = document.getElementById('item-manager-select').value;
const status = document.querySelector('input[name="item-status"]:checked').value;
if (!customer || !itemName || !manager) {
alert('고객사, 품목명, 담당을 모두 입력해주세요.');
return;
}
const isNewItem = !itemsState.editingItemId;
let materialCode = '';
if (isNewItem) {
materialCode = document.getElementById('item-material-code-input').value.trim();
if (!materialCode) {
alert('MP자재코드를 입력해주세요.');
return;
}
}
const isNewCustomer = itemsState.pendingNewCustomerName !== null && itemsState.pendingNewCustomerName === customer;
let customerCode = '';
if (isNewCustomer) {
customerCode = document.getElementById('item-customer-code-input').value.trim();
if (!customerCode) {
alert('신규 고객사는 고객사코드를 입력해주세요.');
return;
}
}
const btn = document.getElementById('item-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  try {
// 2026-08-19: 신규 고객사 등록과 품목 등록/수정을 별도의 두 요청(upsertCustomer →
// upsertItem)으로 나눠 보내던 것을 하나의 upsertItem 요청으로 합쳤다. 예전에는 첫 번째
// 요청(고객사 등록)이 성공한 뒤 두 번째 요청(품목 등록/수정)이 네트워크 오류 등으로
// 실패하면 고객사만 영구히 남는 불일치가 생겼다(실사용 중 발견). 이제는 서버가 하나의
// Lock 구간에서 원자적으로 처리해서, 이번 요청으로 새로 만든 고객사는 품목 등록/수정이
// 어떤 이유로든 실패하면 서버 쪽에서 자동으로 삭제(보정)된다.
const payload = {
itemId: itemsState.editingItemId || '',
customer: customer,
itemName: itemName,
manager: manager,
materials: itemsState.selectedMaterials.join(','),
status: status
};
if (isNewItem) payload.materialCode = materialCode;
if (isNewCustomer) payload.newCustomerCode = customerCode;
// upsertItem Cloud Run 배선(설계 승인 완료 — UPSERTITEM_UPSERTCUSTOMER_CLOUDRUN_DESIGN.md):
// CLOUD_RUN_UPSERT_ITEM_URL이 채워져 있으면 upsertItemRemote_()의 3단 폴백 정책을 먼저
// 시도하고, 비어 있으면(롤백 상태) 기존 Apps Script 경로를 그대로 쓴다 — postComment/
// updateComment/deleteComment와 동일한 "빈 문자열로 롤백" 스위치 패턴.
const res = (await upsertItemRemote_(payload)) || await callApi('upsertItem', payload);
if (!res.ok) {
if (res.error === 'AMBIGUOUS_NEEDS_CONFIRMATION') {
  alert('저장 여부를 확인할 수 없습니다.\n잠시 후 새로고침해서 실제로 저장됐는지 확인해주세요.\n저장되지 않았다면 다시 시도해주세요.');
  if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  return;
}
const msg = res.error === 'MATERIAL_CODE_ALREADY_EXISTS' ? '이미 사용 중인 MP자재코드예요.'
  : res.error === 'MISSING_MATERIAL_CODE' ? 'MP자재코드를 입력해주세요.'
  : res.error === 'CUSTOMER_CODE_ALREADY_EXISTS' ? '이미 사용 중인 고객사코드예요.'
  : res.error === 'CUSTOMER_ALREADY_EXISTS' ? '이미 존재하는 고객사명이에요.'
  : ('저장 실패: ' + (res.error || 'SERVER_ERROR'));
alert(msg);
if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  return;
}
if (isNewCustomer) {
itemsState.customers.push({ code: customerCode, name: customer, manager: manager });
itemsState.pendingNewCustomerName = null;
showCustomerCodeField(false);
}
closeItemForm();
await loadItems();
} catch (e) {
alert('네트워크 오류가 발생했어요.');
if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  }
}

// 2026-09-07: [로그아웃 후에도 FCM 알림이 오는 문제 수정] 로그아웃(무활동 로그아웃 포함) 시
// 이 기기의 푸시 구독을 서버(Firestore pushSubscriptions)에서 비활성화하고, 브라우저 쪽 FCM
// 토큰도 정리한다. 세션이 이미 만료됐을 수 있는 경로(무활동 로그아웃)에서도 호출되므로,
// 실패해도 절대 로그아웃 자체를 막지 않는다 — 전부 best-effort이며 에러는 조용히 무시한다.
// sessionToken은 반드시 localStorage.mro_session을 지우기 "전에" 넘겨받아야 서버가 인증할 수
// 있다(호출부에서 지우기 전에 이 함수부터 호출).
async function unregisterPushOnLogout_(sessionToken) {
  try {
    const deviceId = localStorage.getItem('mro_device_id');
    if (sessionToken && deviceId && CLOUD_RUN_UNREGISTER_PUSH_SUBSCRIPTION_URL) {
      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, 5000);
      await fetch(CLOUD_RUN_UNREGISTER_PUSH_SUBSCRIPTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionToken: sessionToken, deviceId: deviceId }),
        signal: controller.signal
      }).catch(function () {});
      clearTimeout(timeoutId);
    }
  } catch (e) {}
  // 브라우저에 남아있는 FCM 토큰 자체도 폐기한다 — 서버 쪽 구독 비활성화와 별개로, 다음 로그인 때
  // initPushOnLogin_()/syncPushTokenIfNeeded()가 깨끗하게 새 토큰을 발급받아 재등록하게 된다.
  try {
    if (typeof firebase !== 'undefined' && firebase.messaging) {
      await firebase.messaging().deleteToken();
    }
  } catch (e) {}
  localStorage.removeItem('mro_fcm_token');
}

function doLogout() {
  const sessionToken = session && session.sessionToken;
  // [2026-09-10 로그아웃 지연/멈춤 버그 수정] 2026-09-07(ec663ed)에서 doLogout()이
  // async로 바뀌면서 이 호출을 await하게 됐는데, unregisterPushOnLogout_ 자체가 "실패해도
  // 로그아웃을 절대 막지 않는다"는 best-effort 설계(위 함수 주석 참고)였던 걸 실수로
  // blocking으로 만들어버린 것 — 서버 fetch(최대 5초 타임아웃) + deleteToken()을 다 기다린
  // 후에야 로그인 화면으로 넘어가서, 로그아웃 버튼을 누르면 몇 초씩 멈췄다 갑자기 화면이
  // 바뀌는 것처럼 보였다(재홍님 실측 확인, 2026-09-09). 원래 의도대로 되돌려 await 없이
  // 백그라운드로 흘려보내고, 화면 전환은 즉시 진행한다.
  unregisterPushOnLogout_(sessionToken).catch(function () {});
  localStorage.removeItem('mro_session');
  clearIdleTracking();
  // 로그아웃 후에도 OS 앱 아이콘 뱃지 숫자가 남아있던 문제 수정. setAppBadge를 지원하지
  // 않는 브라우저/환경에서도 안전하게 동작하도록 존재 여부를 확인하고, 실패해도(권한 등)
  // 로그아웃 자체가 막히지 않도록 방어한다.
  try {
    if (navigator.clearAppBadge) navigator.clearAppBadge();
  } catch (e) {}
  window.location.href = 'index.html';
}
</script>
