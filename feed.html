<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRO 자재 시황 관리 시스템 - 피드</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a6b52">
<style>
  :root {
    --accent: #1a6b52;
    --accent-dark: #0f4a38;
    --accent-soft: #eaf3ef;
    --blue: #2f5fd0;
    --blue-dark: #1f3f96;
    --blue-soft: #e8eefc;
    --purple: #7c4fd0;
    --bg: #f6f5f2;
    --card: #ffffff;
    --border: #e2e0da;
    --text: #1f2320;
    --text-muted: #6b6f6a;
    --danger: #b3413a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    z-index: 40;
  }
  .sidebar-title { font-size: 15px; font-weight: 700; margin: 4px 12px 18px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 8px;
    font-size: 14px; color: var(--text-muted);
    cursor: pointer; margin-bottom: 2px;
  }
  .nav-item .ic { font-size: 15px; }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .nav-item:hover:not(.active) { background: var(--bg); }
  .nav-badge {
    margin-left: auto; background: #e24b4a; color: #fff;
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px;
  }
  .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .sidebar-me { font-size: 12px; color: var(--text-muted); padding: 6px 12px; }
  .sidebar-logout {
    font-size: 13px; color: var(--danger); cursor: pointer;
    padding: 8px 12px; border-radius: 8px;
  }
  .sidebar-logout:hover { background: var(--bg); }

  .drawer-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30;
  }
  .drawer-overlay.open { display: block; }
  .hamburger {
    display: none;
    font-size: 20px; background: none; border: none; cursor: pointer;
    color: var(--text); padding: 4px 8px;
  }

  .content { flex: 1; min-width: 0; }

  .topbar {
display: flex; align-items: center; gap: 10px; justify-content: space-between;
padding: 16px 24px;
border-bottom: 1px solid var(--border);
background: var(--card);
position: sticky; top: 0; z-index: 25;
}
  .search-box {
display: flex; align-items: center; gap: 8px;
color: var(--text-muted); font-size: 14px;
flex: 1; max-width: 320px;
}
.search-box input {
border: none; outline: none; background: transparent;
font-size: 14px; color: var(--text); width: 100%; font-family: inherit;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-clear-btn {
background: none; border: none; color: var(--text-muted); cursor: pointer;
font-size: 13px; padding: 2px 4px; display: none;
}
.search-clear-btn.show { display: inline-block; }
  .team-select { font-size: 13px; color: var(--text-muted); cursor: pointer; }

  .main { padding: 20px 24px 60px; max-width: 760px; margin: 0; }

  .feed-empty {
    text-align: center; color: var(--text-muted); font-size: 13px; padding: 60px 0;
  }
  .feed-loading {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-muted); font-size: 13px; padding: 60px 0;
  }
  .feed-loading .mro-spinner { width: 15px; height: 15px; border-width: 2px; }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    scroll-margin-top: 20px;
  }
  .post-card.flash { animation: flash-highlight 1.6s ease; }
.post-card.all-confirmed { background: var(--accent-soft); border-color: #b9d9cb; }
  @keyframes flash-highlight {
    0% { box-shadow: 0 0 0 3px var(--accent); }
    100% { box-shadow: none; }
  }
  .post-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bot-icon {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .bot-name { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .material-badge {
    font-size: 16px; font-weight: 700; color: var(--blue);
    background: var(--blue-soft); border: 1px solid #c9d9f7;
    padding: 3px 12px; border-radius: 20px;
  }
  .post-time { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .post-title { font-size: 16px; font-weight: 700; margin: 2px 0 6px; line-height: 1.4; }
  .post-summary { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }
  .article-link {
    font-size: 13px; color: var(--blue); text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;
  }
  .article-link:hover { text-decoration: underline; }

  .items-box { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .items-box-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; font-size: 12px; color: var(--text-muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }

  .item-row {
    display: grid; grid-template-columns: 1.3fr 1.3fr 1fr;
    align-items: center;
    padding: 12px 14px; font-size: 13px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--bg); }
  .item-row .customer { font-weight: 600; }
  .item-row .status { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .status-dot { font-size: 13px; }
  .status.checked .status-dot { color: var(--accent); }
  .status.unchecked .status-dot { color: #b8bcb8; }
.item-row.checked { background: var(--accent-soft); }

  .comment-thread {
    display: none;
    background: #fbfaf7;
    border-top: 1px dashed var(--border);
    padding: 14px;
  }
  .comment-thread.open { display: block; }
  .thread-empty { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }

  .comment-item { display: flex; gap: 8px; margin-bottom: 12px; }
  .comment-item.pending { opacity: 0.55; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .role-담당 { background: var(--accent); }
  .role-팀장 { background: var(--blue); }
  .role-임원 { background: var(--purple); }
  .comment-body { flex: 1; min-width: 0; }
  .reply-to { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .comment-head { font-size: 12px; margin-bottom: 2px; }
  .comment-head .name { font-weight: 700; color: var(--text); }
  .comment-head .role { color: var(--text-muted); margin-left: 4px; }
  .comment-head .time { color: var(--text-muted); margin-left: 6px; }
  .comment-text { font-size: 13px; line-height: 1.5; color: var(--text); white-space: pre-wrap; }
  .comment-reply-btn {
    font-size: 11px; color: var(--blue); background: none; border: none;
    cursor: pointer; padding: 4px 0; margin-top: 2px;
  }
  .comment-actions { display: flex; gap: 12px; margin-top: 2px; }
  .comment-actions button { margin-top: 0; }
  .comment-edit-btn {
    font-size: 11px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .comment-delete-btn {
    font-size: 11px; color: var(--danger); background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .edit-composer { margin-top: 4px; }
  .edit-composer textarea {
    width: 100%; resize: none; font-family: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: #fff; min-height: 40px; margin-bottom: 6px;
  }
  .edit-composer .edit-actions { display: flex; gap: 8px; }
  .edit-composer button {
    border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .edit-composer .save-btn { background: var(--accent); color: #fff; }
  .edit-composer .cancel-btn { background: var(--bg); color: var(--text-muted); }

  .reply-composer { margin-top: 10px; display: flex; gap: 8px; }
  .reply-composer textarea {
    flex: 1; resize: none; font-family: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    background: #fff; min-height: 40px;
  }
  .reply-composer button {
    border: none; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 0 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .reply-composer button:disabled { background: #b8bcb8; cursor: not-allowed; }

  .feed-load-more-btn {
    display: block; width: 100%; margin: 12px 0 24px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
    border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .feed-load-more-btn:disabled { color: #b8bcb8; cursor: not-allowed; }

  .first-comment-btn {
    border: 1px solid var(--accent); color: var(--accent); background: #fff;
    border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .first-comment-form { margin-top: 8px; }
  .thread-error { font-size: 12px; color: var(--danger); margin-top: 6px; }

  .notif-panel { border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; }
  .notif-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--bg); }
  .notif-item .flex1 { flex: 1; min-width: 0; }
  .notif-item .top-line { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .notif-item .headline { font-size: 14px; font-weight: 600; }
  .notif-empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .notif-section-title {
    padding: 10px 16px; font-size: 12px; font-weight: 700; color: var(--text-muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .notif-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.notif-tab { border: none; background: transparent; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.notif-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.notif-tab-count { background: var(--accent-soft); color: var(--text); border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
.notif-tab.active .notif-tab-count { background: var(--accent); color: #fff; }
.notif-tab-content { display: flex; flex-direction: column; gap: 10px; }
.notif-group-title { font-size: 13px; font-weight: 600; color: var(--text-muted); padding: 14px 4px 6px; }
.notif-post-card { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .notif-post-card:last-child { border-bottom: none; }
  .notif-post-card .top-line { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .notif-post-card .headline { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .notif-reply-list { display: flex; flex-direction: column; gap: 6px; }
  .notif-reply-row {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; background: var(--bg);
  }
  .notif-reply-row:hover { background: var(--accent-soft); }
  .notif-reply-row .top-line { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .notif-reply-prev { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .notif-reply-curr { font-size: 12px; color: var(--text); font-weight: 500; }

  .items-search-input { flex: 1; max-width: 320px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
.settings-panel { max-width: 640px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 20px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-of-type { border-bottom: none; }
.settings-row-label { flex: 1; min-width: 0; }
.settings-row-title { font-size: 14px; font-weight: 600; }
.settings-row-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
.settings-row .settings-row-input { width: 200px; flex-shrink: 0; }

.items-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.items-toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }
.item-new-btn { border: none; background: var(--accent); color: #fff; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.items-scroll-top { overflow-x: auto; overflow-y: hidden; height: 14px; margin-bottom: 6px; }
#items-scroll-top-inner { height: 1px; }
.items-table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 600; white-space: nowrap; }
.items-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.items-table tbody tr { cursor: pointer; }
.items-table tbody tr:hover { background: var(--accent-soft); }
.item-status-badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.item-status-badge.active { background: #e3f3e9; color: #1e8449; }
.item-status-badge.inactive { background: #f1f1f1; color: #888; }
.item-form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.item-form-card { background: #fff; border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
.item-form-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; margin-bottom: 18px; }
.team-lead-badge { background: #fdece9; color: #d35233; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
.form-group { margin-bottom: 16px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.form-input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; box-sizing: border-box; }
.form-input:disabled { background: #f5f5f5; color: var(--text-muted); }
.customer-search-wrap { position: relative; }
.customer-suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; max-height: 180px; overflow-y: auto; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
.customer-suggestion-item { padding: 8px 11px; font-size: 13px; cursor: pointer; }
.customer-suggestion-item:hover { background: var(--accent-soft); }
.customer-suggestion-item.add-new { color: var(--accent); font-weight: 600; border-top: 1px solid var(--border); }
.material-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 28px; }
.material-tag { background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.material-tag-remove { cursor: pointer; color: var(--text-muted); font-weight: 700; }
.ai-suggest-btn { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.item-code-hint { font-weight: 400; color: var(--text-muted); }
.item-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn-secondary { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 9px 18px; font-size: 13px; cursor: pointer; }
.btn-primary { border: none; background: var(--text); color: #fff; border-radius: 6px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }

.user-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.user-row select, .user-row input[type="text"] {
font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff;
}
.user-row input[type="text"] { width: 110px; }
.user-save-btn {
border: none; background: var(--accent); color: #fff; border-radius: 6px;
padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.user-save-btn:disabled { background: #b8bcb8; cursor: not-allowed; }
.user-save-msg { font-size: 12px; color: var(--text-muted); }

@media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,.12);
    }
    .sidebar.open { transform: translateX(0); }
    .hamburger { display: inline-block; }
    .main { padding: 16px 14px 60px; }
    .topbar { padding: 12px 14px; }
    .item-row { grid-template-columns: 1fr; gap: 4px; }
    .item-row .status { justify-content: flex-start; }
  }

  #auth-loading-overlay {
    position: fixed; inset: 0; background: #fff; z-index: 9999;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .35s ease;
  }
  .auth-center-logo {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    height: 56px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap;
    box-shadow: 0 0 0 8px rgba(26,107,82,0.10), 0 6px 18px rgba(26,107,82,0.25);
    z-index: 5;
    animation: authLoadingPulse 1.8s ease-in-out infinite;
  }
  @keyframes authLoadingPulse {
    0%, 100% { box-shadow: 0 0 0 8px rgba(26,107,82,0.10), 0 6px 18px rgba(26,107,82,0.25); }
    50% { box-shadow: 0 0 0 14px rgba(26,107,82,0.06), 0 6px 18px rgba(26,107,82,0.25); }
  }
  .auth-caption {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    font-size: 13px; color: var(--text-muted); white-space: nowrap; z-index: 5;
  }
  .auth-caption b { color: var(--accent-dark); }
  .auth-news-card {
    position: absolute; left: 50%; top: 50%;
    width: 78px; height: 40px;
    margin: -20px 0 0 -39px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.14);
    padding: 5px 7px 5px 20px;
    z-index: 3;
  }
  .auth-news-card::before {
    content: "📰";
    position: absolute; left: 5px; top: 6px;
    font-size: 11px;
  }
  .auth-news-card .l1 { height: 4px; border-radius: 2px; background: var(--accent); width: 80%; margin-bottom: 5px; }
  .auth-news-card .l2 { height: 3px; border-radius: 2px; background: #d8d6cf; width: 60%; }
  .auth-orbit-wrap {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    animation-name: authOrbitSpin;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes authOrbitSpin {
    from { transform: rotate(var(--start-angle)); }
    to   { transform: rotate(var(--end-angle)); }
  }
  .auth-orbit-radius {
    animation-name: authOrbitShrink;
    animation-timing-function: cubic-bezier(.4,.4,.3,1);
    animation-fill-mode: forwards;
  }
  @keyframes authOrbitShrink {
    0%   { transform: translateX(var(--radius)); opacity: 0; }
    12%  { opacity: 1; }
    78%  { opacity: 1; }
    100% { transform: translateX(0); opacity: 0; }
  }
  .auth-orbit-radius .auth-news-card { margin: -20px 0 0 -39px; transform: rotate(calc(-1 * var(--start-angle))); }
  @media (max-width: 480px) {
    .auth-news-card { width: 62px; height: 34px; margin: -17px 0 0 -31px; }
    .auth-orbit-radius .auth-news-card { margin: -17px 0 0 -31px; }
  }

// Code.gs가 idempotencyKey로 중복 실행을 막아주는 쓰기 액션 목록(2026-08-07). 같은 키로

// 이 위에 localStorage 큐를 얹는 방향으로 확장 가능.
const IDEMPOTENT_WRITE_ACTIONS = new Set([
  'postComment', 'updateComment', 'deleteComment', 'markChecked',
  'upsertItem', 'updateSettings', 'updateUser', 'markThreadSeen',
  'upsertCustomer', 'changePassword'
]);

const API_REQUEST_TIMEOUT_MS = 20000;
const API_HEDGE_DELAY_MS = 2500;                  // 1차 요청이 이 시간 안에 안 끝나면 2차(중복) 요청을 추가로 보낸다.
const API_ROUND_BACKOFF_MS = [1500, 3000, 6000]; // 라운드(=hedge 세트 또는 단일 시도) 사이 대기. 기존 800/1600ms에서 상향.

function generateIdempotencyKey_() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  // 구형 브라우저(iOS 15.4 미만 Safari 등) 폴백
  return 'idem-' + Date.now() + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

function apiFetchOnce_(action, body) {
  const controller = new AbortController();
  // 응답이 아예 안 오고 멈추는 경우(콜드 스타트/네트워크 지연/GAS 응답 유실 등)를 대비해 일정
  // 시간 후 강제로 요청을 중단시킨다. abort되면 fetch가 예외를 던져 재시도 루프로 이어진다.
  const timeoutId = setTimeout(function () { controller.abort(); }, API_REQUEST_TIMEOUT_MS);
  return fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, sessionToken: session ? session.sessionToken : null }, body)),
    signal: controller.signal
  }).then(function (res) { return res.json(); })
    .finally(function () { clearTimeout(timeoutId); }); } function sendDebugLogBeacon_(body) { const payload = JSON.stringify(Object.assign({}, body, { action: 'clientDebugLog', sessionToken: session ? session.sessionToken : null })); try { if (navigator.sendBeacon && navigator.sendBeacon(GAS_URL, payload)) return; } catch (e) {} try { fetch(GAS_URL, { method: 'POST', body: payload, keepalive: true }).catch(function () {}); } catch (e) {} }

// 여러 요청 중 가장 먼저 "성공"하는 응답을 사용한다(Promise.race는 가장 먼저 실패하는 것도
// 그대로 확정해버려서 이 용도에는 안 맞아 직접 구현). 전부 실패해야만 reject한다.
function raceFirstSuccess_(factories) {
  return new Promise(function (resolve, reject) {
    let remaining = factories.length;
    let firstErr = null;
    factories.forEach(function (factory) {
      factory().then(resolve, function (err) {
        if (firstErr === null) firstErr = err;
        remaining -= 1;
        if (remaining === 0) reject(firstErr);
      });
    });
  });
}

// 읽기 전용(조회) 액션 전용. 1차 요청을 보내고, 800ms 안에 응답이 없으면 완전히 동일한 요청을
// 한 번 더(2차) 보내서 두 요청 중 먼저 성공하는 응답을 쓴다. GAS 프록시 구간에서 응답이
// 간헐적으로 유실되는 문제를 완화하기 위한 방어책(2026-08-07 doPost 실행 기록 분석 결과,
// 서버 실행 자체는 항상 빠르게 정상 완료되고 있어 "응답 전달 유실"이 유력한 원인으로 확인됨).
// 중복 전송이라 부작용 없는 조회 액션에만 적용한다.
function hedgedFetch_(action, body) {
  let hedgeTimer = null;
  const primary = apiFetchOnce_(action, body).then(function (r) {
    if (hedgeTimer) clearTimeout(hedgeTimer);
    return r;
  });
  const hedge = new Promise(function (resolve, reject) {
    hedgeTimer = setTimeout(function () {
      apiFetchOnce_(action, body).then(resolve, reject);
    }, API_HEDGE_DELAY_MS);
  });
  return raceFirstSuccess_([function () { return primary; }, function () { return hedge; }]);
}

let connDelayNoticeEl_ = null;
  let suppressConnDelayNoticeUntil_ = 0;
function showConnDelayNotice_() {
  if (Date.now() < suppressConnDelayNoticeUntil_) return;
  if (!connDelayNoticeEl_) {
    connDelayNoticeEl_ = document.createElement('div');
    connDelayNoticeEl_.textContent = '서버 연결이 지연되고 있어요. 잠시 후 자동으로 다시 시도합니다.';
    connDelayNoticeEl_.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);' +
      'background:var(--accent-dark);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;' +
      'z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:90vw;text-align:center;';
    document.body.appendChild(connDelayNoticeEl_);
  }
  connDelayNoticeEl_.style.display = 'block';
}
function hideConnDelayNotice_() {
  if (connDelayNoticeEl_) connDelayNoticeEl_.style.display = 'none';
}

async function callApi(action, body) {
    const isRetryableRead = RETRYABLE_API_ACTIONS.has(action);
    const isIdempotentWrite = IDEMPOTENT_WRITE_ACTIONS.has(action);
    // 쓰기 액션은 재시도 전체에서 같은 idempotencyKey를 재사용해야 서버가 중복을 걸러낼 수 있다.
    const requestBody = isIdempotentWrite ? Object.assign({ idempotencyKey: generateIdempotencyKey_() }, body) : body;
    // 읽기 전용 액션: hedge 요청으로 최대 3라운드까지 재시도. 쓰기 액션: idempotencyKey를 단 채로
    // 실패 후 짧게 한 번만 더 재시도(서버가 중복 실행을 막아주므로 이제 안전하다). 그 외(로그인
    // 등 인증 흐름)는 기존처럼 1회만 시도.
    const maxRounds = isRetryableRead ? 3 : (isIdempotentWrite ? 2 : 1);
    const __t0 = Date.now();
    let lastErr;
    for (let round = 0; round < maxRounds; round++) {
          try {
                  const useHedge = isRetryableRead && round === 0; const result = useHedge
                    ? await hedgedFetch_(action, requestBody)
                            : await apiFetchOnce_(action, requestBody);
                  hideConnDelayNotice_();
                  if (round > 0) logApiDelayEvent_(action, round, 'recovered', Date.now() - __t0);
                  return result;
          } catch (e) {
                  lastErr = e;
                  if (round < maxRounds - 1) {
                            if (isRetryableRead && round === 0) {
                                        showConnDelayNotice_();
                                        logApiDelayEvent_(action, round, 'delayed', Date.now() - __t0);
                            }
                            await new Promise(function (resolve) { setTimeout(resolve, API_ROUND_BACKOFF_MS[round] || 6000); });
                  }
          }
    }
    hideConnDelayNotice_();
    logApiDelayEvent_(action, maxRounds - 1, 'failed', Date.now() - __t0);
    throw lastErr;
}

  // 지연/재시도 이벤트를 서버 디버그로그(clientDebugLog)에 남긴다. 결과를 기다리지 않는
  // fire-and-forget이며 실패해도 무시한다. clientDebugLog 자기 자신의 재시도까지 로깅하면
  // 무한 재귀가 될 수 있어 제외한다.
  function logApiDelayEvent_(action, round, outcome, elapsedMs) {
      if (action === 'clientDebugLog') return;
      // callApi()가 아니라 apiFetchOnce_()로 직접 보낸다. callApi를 쓰면 이 로깅 요청 자체도
        // hedge/재시도/지연 팝업 로직을 다시 타서, "지연을 기록하는 행위"가 지연 팝업을 한 번 더
        // 유발하는 자기증폭 문제가 생긴다(2026-08-12 발견). apiFetchOnce_는 단발성 요청이라 안전하다.
        sendDebugLogBeacon_({ kind: 'apiDelay', targetAction: action, round: round, outcome: outcome, elapsedMs: elapsedMs, at: new Date().toISOString() });
  }

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

str = String(str || '');
return str.length > maxLen ? str.slice(0, maxLen) + '…' : str;

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return `오늘 ${hh}:${mm}`;
  return `${d.getMonth() + 1}.${d.getDate()} ${hh}:${mm}`;
}

// 무활동 로그아웃 설정을 서버에서 못 읽어왔을 때 쓰는 안전한 기본값.
// 실제 운영 설정값(설정 시트의 '무활동로그아웃분')과 같은 값으로 맞춰둔다 - 임의로 짧은 값을
// 기본값으로 쓰면 설정 조회가 실패했을 때 의도치 않게 너무 빨리 로그아웃되는 문제가 생긴다.
const IDLE_TIMEOUT_FALLBACK_MINUTES = 600;

// 무활동 로그아웃 판정은 브라우저를 계속 열어둔 경우엔 자바스크립트 타이머(resetIdleTimer)로,
// 앱이 완전히 재시작된 경우(백그라운드에서 종료 후 재실행 등)엔 localStorage에 남겨둔
// "마지막 활동 시각"과 현재 시각의 차이로 판정한다. 둘 다 같은 기준(설정된 분 수)을 쓴다.
function getEffectiveIdleTimeoutMinutes() {
const cached = Number(localStorage.getItem('mro_idle_timeout_minutes'));
return cached > 0 ? cached : IDLE_TIMEOUT_FALLBACK_MINUTES;
}
function isIdleTimedOut() {
const lastActivityRaw = localStorage.getItem('mro_last_activity');
if (!lastActivityRaw) return false; // 기록이 없으면(예: 최초 로그인 직후) 초과로 판단하지 않는다.
const elapsedMs = Date.now() - Number(lastActivityRaw);
return elapsedMs > getEffectiveIdleTimeoutMinutes() * 60 * 1000;
}
function clearIdleTracking() {
localStorage.removeItem('mro_last_activity');
}

// notifFetchSeq는 원래 아래쪽 알림 관련 코드 블록에 있었는데, proceedAfterAuth()가 이제
// loadNotifNewPosts()를 await 없이 즉시(동기적으로) 호출하기 시작하면서, 바로 아래 init()
// IIFE가 실행되는 시점에 아직 초기화 전이라 "Cannot access 'notifFetchSeq' before
// initialization" 오류로 무한로딩을 일으켰다(2026-08-07 발견). init() 실행 전에 선언되도록
// 여기로 옮겼다.
let notifFetchSeq = 0; // 알림 갱신 요청의 최신 순번 추적: 오래된 응답이 새 응답을 덮어써 배지/푸시가 잘못된 값으로 떴다가 몇 초 뒤 저절로 정정되는 레이스 방지

// login/whoami 전환 계획 2단계(2026-08-18): Cloud Run whoami로 서버 최신 name/role/team을
// best-effort로 가져와 localStorage를 갱신한다. 절대로 이 호출의 실패/타임아웃을 이유로
// 로그아웃시키지 않는다 — 세션 만료/미인증 판정은 기존처럼 getFeed의 UNAUTHORIZED 처리에게만
// 맡긴다 (fire-and-forget이며 화면 흐름을 막지 않음).
async function refreshSessionViaWhoami_() {
  if (!session || !session.sessionToken) return;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(function () { controller.abort(); }, 3000);
    const res = await fetch(CLOUD_RUN_WHOAMI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionToken: session.sessionToken }),
      signal: controller.signal
    }).then(function (r) { return r.json(); }).finally(function () { clearTimeout(timeoutId); });
    if (res && res.ok) {
      session.name = res.name || session.name;
      session.role = res.role || session.role;
      session.team = res.team || session.team;
      session.email = res.email || session.email;
      localStorage.setItem('mro_session', JSON.stringify(session));
      const sidebarMe = document.getElementById('sidebar-me');
      if (sidebarMe) sidebarMe.textContent = '👤 ' + (session.name || '') + ' ' + (session.role || '');
    }
  } catch (e) {
    // 네트워크 오류/타임아웃 등 — 조용히 무시. 실패해도 기존 Apps Script 기반 인증 흐름은 그대로 유지된다.
  }
}

setupTeamLabelControl();
const [__authTIdle, __authTSeen, __authTNotif] = await Promise.all([idlePromise, seenPromise, notifPromise]);

// 알림 개수 집계가 완전히 끝난 뒤에야 "MRO 뉴스 수집 중" 애니메이션을 종료한다.

async function submitForcedPasswordChange() {

const itemCommentCounts = {};

function primeCommentsFromFeed(posts) {
  // A. 댓글 예열: getFeed가 이미 품목별 comments를 실어보내므로, 스레드를 열 때마다
  // getComments를 다시 호출하지 않도록 postComments 캐시를 미리 채워둔다.
  // B. 폴링 비교용으로 품목별 commentCount도 같이 기록해둔다.
  (posts || []).forEach(function (post) {
    let merged = [];
    (post.items || []).forEach(function (it) {
      itemCommentCounts[post.id + '-' + it.itemId] = it.commentCount || 0;
      if (it.comments && it.comments.length) merged = merged.concat(it.comments);
    });
    postComments[post.id] = { loaded: true, comments: merged };
  });
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  // setInterval 대신 재귀 setTimeout을 쓴다: pollForUpdates 한 번이 재시도 때문에 30초보다
  // 오래 걸리는 경우가 실제로 있었는데, setInterval은 그 이전 호출이 아직 안 끝났어도 다음
  // 틱을 그냥 또 쏴버려서 요청이 겹쳐 쌓이는 문제가 있었다(디버그로그에서 확인). 재귀 setTimeout은
  // 이전 호출이 끝난 뒤에야 다음 타이머를 거니까 구조적으로 겹칠 수가 없다.
  const scheduleNext = function () {
    pollTimer = setTimeout(function () {
      pollForUpdates().finally(scheduleNext);
    }, 30000);
  };
  scheduleNext();
}

// PWA/브라우저가 백그라운드에서 동결(freeze)됐다가 다시 화면에 보이게 될 때(iOS PWA 복귀, PC 절전 복귀,
// 크롬 메모리 절약 모드 복귀 등) 오래된(stale) 알림/피드 상태가 잠깐 잘못 보이는 문제를 막기 위해,
// 화면이 다시 보이는 즉시 최신 데이터로 강제 갱신한다.
// iOS PWA는 앱 전환기에서 돌아올 때 visibilitychange가 안 잡히는 경우가 있어,
// pageshow(bfcache 복귀)와 window focus도 같이 걸어 이중삼중으로 안전하게 잡는다.
let lastResumeRefreshAt = 0;
function refreshOnResume() {
  suppressConnDelayNoticeUntil_ = Date.now() + 8000;
  const now = Date.now();
  if (now - lastResumeRefreshAt < 2000) return; // 여러 이벤트가 한번에 겹쳐 몰려도 중복 호출 방지
  lastResumeRefreshAt = now;
  if (!(session && session.sessionToken)) return;
  // iOS가 백그라운드에서 깨어난 직후엔 와이파이/셀룰러가 아직 완전히 준비 안 된 경우가 있어
  // 살짝 지연 후 요청하고, 그래도 실패하면 한번 더 재시도한다.
  setTimeout(function () {
    loadFeed();
    pollForUpdates(); // 알림 배지 갱신은 pollForUpdates 내부에서 처리. (예전엔 여기서 loadNotifNewPosts를 또 호출해 동시에 두 번 요청이 나가면서, 나중에 도착한 오래된 응답이 배지/푸시를 잘못된 값으로 갱신했다가 몇 초 뒤 저절로 정정되는 레이스가 있었음)
    if (currentView === 'items') loadItems();
    if (currentView === 'notif') { loadNotifNewPosts().then(function () { renderNotif(); updateNotifBadge(); }); }
    if (currentView === 'users') loadUsers();
  }, 600);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') refreshOnResume();
});
window.addEventListener('pageshow', function (e) {
  if (e.persisted || document.visibilityState === 'visible') refreshOnResume();
});
window.addEventListener('focus', refreshOnResume);

async function pollForUpdates() {
try {
const res = await callApi('pollSignal', {});
if (!res.ok) {
if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
doLogout();
}
return;
}
feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
await loadNotifNewPosts();
updateNotifBadge();

const postsToRefresh = new Set();
(res.signatures || []).forEach(function (sig) {
const key = sig.postId + '-' + sig.itemId;
const known = itemCommentCounts[key];
if (known === undefined) return;
if (known !== sig.commentCount) postsToRefresh.add(sig.postId);
});

let feedNeedsRerender = false;
for (const postId of postsToRefresh) {
await loadComments(postId);
const pc = postComments[postId];
if (pc && pc.comments) {
const counts = {};
pc.comments.forEach(function (c) { counts[c.itemId] = (counts[c.itemId] || 0) + 1; });
Object.keys(counts).forEach(function (itemId) {
itemCommentCounts[postId + '-' + itemId] = counts[itemId];
});
// 확인 N/6 배지가 폴링 때 갱신되지 않던 문제 수정: 댓글 여부에 따라
// 품목별 confirmed/commentCount와 게시물의 confirmedCount를 다시 계산한다.
const post = feedState.posts.find(function (p) { return String(p.id) === String(postId); });
if (post && post.items) {
post.items.forEach(function (it) {
const c = counts[it.itemId] || 0;
it.commentCount = c;
it.confirmed = c > 0;
});
post.confirmedCount = post.items.filter(function (it) { return it.confirmed; }).length;
post.totalCount = post.items.length;
feedNeedsRerender = true;
}
}
Object.keys(threadState).forEach(function (key) {
if (key.indexOf(postId + '-') === 0 && threadState[key].open && !threadState[key].replyOpenFor) {
const itemId = key.slice((postId + '-').length);
renderThread(postId, itemId);
}
});
}
if (feedNeedsRerender && !hasOpenComposer()) renderFeed();
} catch (e) {
// 조용히 실패, 다음 주기에 재시도
}
}

async function loadFeed(isRetry) {
  const root = document.getElementById('feed-root');
  try {
    const res = await callApi('getFeed', { cursor: 0 });
    if (!res.ok) {
      if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
        doLogout();
        return false;
      }
      // loadItems()는 !ok 응답에 대해 한번 자동 재시도하는데 loadFeed()는 그렇지 않았던 것이
      // 실제 원인으로 확인됨: 백그라운드 복귀 직후 POST 요청이 앱스스크립트 인프라의 리다이렉트
      // 과정에서 간헐적으로 GET으로 바뀌어 처리되며 ok:false, error:'NOT_FOUND' 응답이 오는
      // 사례를 실제 화면(스크린샷)과 코드로 확인했다. loadItems()와 동일하게 한번만 재시도한다.
      if (!isRetry) { setTimeout(function () { loadFeed(true); }, 1800); return true; }
      root.innerHTML = `<div class="feed-empty">피드를 불러오지 못했어요. (${escapeHtml(res.error || 'SERVER_ERROR')})</div>`;
      return true;
    }
    feedState.posts = res.posts || [];
    primeCommentsFromFeed(res.posts || []);
    feedState.nextCursor = res.nextCursor; feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
    if (!hasOpenComposer()) renderFeed();
if (notifNewPostsCache.loaded) updateNotifBadge();
    return true;
  } catch (e) {
    // 백그라운드 복귀 직후엔 네트워크가 아직 안 붙어 실패할 수 있어 한번만 자동 재시도
    if (!isRetry) { setTimeout(function () { loadFeed(true); }, 1800); return true; }
    root.innerHTML = `<div class="feed-empty">네트워크 오류가 발생했어요. 새로고침 후 다시 시도해주세요.</div>`;
    return true;
  }
}

async function loadMoreFeed() {
  if (feedState.loadingMore || feedState.nextCursor === null || feedState.nextCursor === undefined) return;
  feedState.loadingMore = true;
  renderLoadMoreButton();
  try {
    const res = await callApi('getFeed', { cursor: feedState.nextCursor });
    if (!res.ok) {
      if (res.error === 'SESSION_EXPIRED' || res.error === 'UNAUTHORIZED') {
        doLogout();
        return;
      }
      feedState.loadingMore = false;
      renderLoadMoreButton();
      return;
    }
    feedState.posts = feedState.posts.concat(res.posts || []);
    primeCommentsFromFeed(res.posts || []);
    feedState.nextCursor = res.nextCursor; feedState.totalNeedsAttention = res.totalNeedsAttention || 0;
    feedState.loadingMore = false;
    renderFeed();
    updateNotifBadge();
  } catch (e) {
    feedState.loadingMore = false;
    renderLoadMoreButton();
  }
}

function renderLoadMoreButton() {
  const el = document.getElementById('feed-load-more');
  if (!el) return;
  if (feedState.nextCursor === null || feedState.nextCursor === undefined) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.disabled = feedState.loadingMore;
  el.textContent = feedState.loadingMore ? '불러오는 중...' : '더보기';
}

function updateNotifBadge() {
const showAwaiting = session.role === '팀장' || session.role === '임원';
const newItemsCount = notifNewPostsCache.items.reduce(function (sum, p) {
if (!p.needsAttention) return sum;
return sum + (p.items || []).filter(function (it) { return !it.confirmed; }).length;
}, 0);
let count = newItemsCount;
notifNewPostsCache.items.forEach(function (p) {
count += (p.items || []).filter(function (it) { return hasUnreadReply(p.id, it); }).length;
if (showAwaiting) count += (p.items || []).filter(function (it) { return hasAwaitingReply(p.id, it); }).length;
});
// [TEMP-DIAG 임시 디버그였던 코드 제거 2026-08-06] updateNotifBadge()는 피드 렌더/댓글 로드/탭 전환 등
// 10곳 넘는 곳에서 계속 호출되는데, 그때마다 매번 전체 posts/items 배열을 clientDebugLog로 서버에 통째로
// 보내고 있었다(시트에 append까지 함). 애니메이션 지연 진단이 끝나서 더 이상 필요 없고, 오히려 사용자
// 인터랙션마다 불필요한 앱스스크립트 호출(+시트 쓰기)을 계속 발생시켜 백엔드 부하에 기여하고 있었다.
const badge = document.getElementById('notif-badge');
if (count > 0) {
badge.textContent = count;
badge.style.display = 'inline-block';
} else {
badge.style.display = 'none';
}


if ('setAppBadge' in navigator) {
if (count > 0) navigator.setAppBadge(count).catch(function () {});
else navigator.clearAppBadge().catch(function () {});
}

if (lastNotifCount !== null && count > lastNotifCount && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
const diff = count - lastNotifCount;
showLocalNotification('MRO 자재 시황', '새 알림이 ' + diff + '건 있어요.');
}
lastNotifCount = count;
}

// 6-5: 검색 기능 (현재 로드된 피드 안에서 클라이언트 사이드 필터링)
function matchesSearch(post, query) {
if ((post.materialName || '').toLowerCase().includes(query)) return true;
if ((post.summary || '').toLowerCase().includes(query)) return true;
return (post.items || []).some(function (it) {
return (it.customer || '').toLowerCase().includes(query) || (it.itemName || '').toLowerCase().includes(query);
});
}

function handleSearchInput() {
const input = document.getElementById('search-input');
const clearBtn = document.getElementById('search-clear-btn');
feedState.searchQuery = input.value;
clearBtn.classList.toggle('show', !!input.value);
if (document.getElementById('feed-view').style.display !== 'none') {
renderFeed();
}
}

function clearSearch() {
const input = document.getElementById('search-input');
input.value = '';
feedState.searchQuery = '';
document.getElementById('search-clear-btn').classList.remove('show');
renderFeed();
input.focus();
}

function setupTeamLabelControl() {
const el = document.getElementById('team-label');
if (!el) return;
const isAdmin = session.email === ADMIN_EMAIL;
if (!isAdmin) {
el.textContent = teamLabel(session.team || '') + ' 전체';
return;
}
const teams = Array.from(new Set(feedState.posts.flatMap(function (p) { return (p.items || []).map(function (it) { return it.team; }); }).filter(Boolean)));
feedState.teamFilter = session.team || '동부';
const optionsHtml = ['<option value="">전체 팀</option>'].concat(teams.map(function (t) {
return '<option value="' + escapeHtml(t) + '" ' + (t === feedState.teamFilter ? 'selected' : '') + '>' + escapeHtml(teamLabel(t)) + '</option>';
})).join('');
const select = document.createElement('select');
select.id = 'team-label';
select.className = 'team-select';
select.setAttribute('onchange', 'onTeamFilterChange()');
select.innerHTML = optionsHtml;
el.replaceWith(select);
renderFeed();
}

function onTeamFilterChange() {
feedState.teamFilter = document.getElementById('team-label').value;
renderFeed();
}

function renderFeed() {
const root = document.getElementById('feed-root');
if (!feedState.posts.length) {
root.innerHTML = `<div class="feed-empty">아직 게시된 시황이 없어요.</div>`;
return;
}
const query = (feedState.searchQuery || '').trim().toLowerCase();
const teamFilter = feedState.teamFilter || '';
let list = feedState.posts;
if (teamFilter) {
list = list.filter(function (p) { return (p.items || []).some(function (it) { return it.team === teamFilter; }); });
}
if (query) {
list = list.filter(function (p) { return matchesSearch(p, query); });
}
if ((query || teamFilter) && !list.length) {
root.innerHTML = `<div class="feed-empty">조건에 맞는 게시물이 없어요.</div>`;
return;
}
const hasMore = !query && feedState.nextCursor !== null && feedState.nextCursor !== undefined;
root.innerHTML = list.map(renderPost).join('') +
(hasMore ? `<button id="feed-load-more" class="feed-load-more-btn" onclick="loadMoreFeed()">더보기</button>` : '');
restoreOpenThreads();
}

function restoreOpenThreads() {
// restore threads left open before rerender
(feedState.posts || []).forEach(function (post) {
(post.items || []).forEach(function (item) {
const key = post.id + '-' + item.itemId;
const st = threadState[key];
if (!st || !st.open) return;
const panel = document.getElementById('thread-' + key);
if (!panel) return;
panel.classList.add('open');
renderThread(post.id, item.itemId);
});
});
}

let notifActiveTab = '새 게시물';

function renderNotif() {
const root = document.getElementById('notif-view');

const newPosts = notifNewPostsCache.items.filter(function (p) {
return p.needsAttention && (p.items || []).some(function (it) { return !it.confirmed; });
});

const newPostsItemCount = newPosts.reduce(function (sum, p) { return sum + (p.items || []).filter(function (it) { return !it.confirmed; }).length; }, 0);

const newPostEntries = newPosts.map(function (p) { return { post: p, items: (p.items || []).filter(function (it) { return !it.confirmed; }) }; });

const replyEntries = [];
const awaitingEntries = [];
notifNewPostsCache.items.forEach(function (p) {
const unreadItems = (p.items || []).filter(function (it) { return hasUnreadReply(p.id, it); });
if (unreadItems.length) replyEntries.push({ post: p, items: unreadItems });
const awaitingItems = (p.items || []).filter(function (it) { return hasAwaitingReply(p.id, it); });
if (awaitingItems.length) awaitingEntries.push({ post: p, items: awaitingItems });
});

const showAwaitingTab = session.role === '팀장' || session.role === '임원';

const replyItemCount = replyEntries.reduce(function (sum, e) { return sum + e.items.length; }, 0);
const awaitingItemCount = awaitingEntries.reduce(function (sum, e) { return sum + e.items.length; }, 0);
const tabs = [
{ key: '새 게시물', count: newPostsItemCount },
{ key: '댓글 필요', count: replyItemCount }
];
if (showAwaitingTab) {
tabs.push({ key: '답변 요청', count: awaitingItemCount });
}
if (!tabs.some(function (t) { return t.key === notifActiveTab; })) {
notifActiveTab = tabs[0].key;
}

const tabsHtml = tabs.map(function (t) {
return `<button class="notif-tab ${t.key === notifActiveTab ? 'active' : ''}" onclick="switchNotifTab('${t.key}')">${t.key} <span class="notif-tab-count">${t.count}</span></button>`;
}).join('');

let contentHtml = '';
if (notifActiveTab === '새 게시물') {
contentHtml = renderNotifNewPosts(newPostEntries);
} else if (notifActiveTab === '댓글 필요') {
contentHtml = renderNotifReplyEntries(replyEntries, false);
} else if (notifActiveTab === '답변 요청') {
contentHtml = renderNotifReplyEntries(awaitingEntries, true);
}

root.innerHTML = `
<div class="notif-panel">
<div class="notif-tabs">${tabsHtml}</div>
<div class="notif-tab-content">${contentHtml || '<div class="notif-empty">여기엔 알림이 없어요.</div>'}</div>
</div>
`;
updateNotifPermButton();
}

function switchNotifTab(key) {
notifActiveTab = key;
renderNotif();
}

function renderNotifNewPosts(entries) {
if (!entries.length) return '';
return entries.map(function (entry) {
const p = entry.post;
const rowsHtml = entry.items.map(function (it) {
return `
<div class="notif-reply-row" onclick="goToItem('${p.id}', '${it.itemId}')">
<div class="top-line">${escapeHtml(it.customer || '')} · ${escapeHtml(it.itemName || '')} · ${escapeHtml(it.manager || '')}</div>
</div>
`;
}).join('');
return `
<div class="notif-post-card">
<div class="top-line"><span class="material-badge" style="font-size:11px;padding:1px 8px;">${escapeHtml(p.materialName || '')}</span> ${escapeHtml(fmtTime(p.createdAt))}</div>
<div class="headline">${escapeHtml(truncate(p.summary || p.title || '', 36))}</div>
<div class="notif-reply-list">${rowsHtml}</div>
</div>
`;
}).join('');
}

function renderNotifReplyEntries(entries, isAwaiting) {
if (!entries.length) return '';
return entries.map(function (entry) {
const p = entry.post;
const rowsHtml = entry.items.map(function (it) {
const comments = (it.comments || []).slice().sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
const prev = comments.length >= 2 ? comments[comments.length - 2] : null;
const curr = comments.length >= 1 ? comments[comments.length - 1] : null;
return `
<div class="notif-reply-row" onclick="goToItem('${p.id}', '${it.itemId}')">
<div class="top-line">${escapeHtml(it.customer || '')} · ${escapeHtml(it.itemName || '')} · ${escapeHtml(it.manager || '')}</div>
${prev ? `<div class="notif-reply-prev">이전 답글: ${escapeHtml(truncate(prev.content || '', 30))}</div>` : ''}
${curr ? `<div class="notif-reply-curr">${isAwaiting ? '내 답글' : '현재 답글'}: ${escapeHtml(truncate(curr.content || '', 30))}</div>` : ''}
</div>
`;
}).join('');
return `
<div class="notif-post-card">
<div class="top-line"><span class="material-badge" style="font-size:11px;padding:1px 8px;">${escapeHtml(p.materialName || '')}</span> ${escapeHtml(fmtTime(p.createdAt))}</div>
<div class="headline">${escapeHtml(truncate(p.summary || p.title || '', 36))}</div>
<div class="notif-reply-list">${rowsHtml}</div>
</div>
`;
}).join('');
}

function goToPost(postId) {
  switchView('feed');
  setTimeout(() => {
    const el = document.getElementById('post-' + postId);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }, 50);
}

// C. 알림함 "확인 완료 · 댓글 필요" 섹션 — 품목(스레드) 단위 클릭 타겟.
// 게시물로 스크롤한 뒤, 해당 품목 행으로 다시 스크롤하고 스레드가 닫혀있으면 열어준다.
function goToItem(postId, itemId) {
  switchView('feed');
  setTimeout(async () => {
    const key = postId + '-' + itemId;

    // 팀 필터/검색어가 걸려 있으면 대상 게시물이 렌더링에서 제외되어 row가 안 만들어질 수 있으므로 먼저 해제
    let filtersCleared = false;
    if (feedState.teamFilter) {
      feedState.teamFilter = '';
      const teamSelectEl = document.getElementById('team-label');
      if (teamSelectEl && teamSelectEl.tagName === 'SELECT') teamSelectEl.value = '';
      filtersCleared = true;
    }
    if (feedState.searchQuery) {
      feedState.searchQuery = '';
      const searchInputEl = document.getElementById('search-input');
      if (searchInputEl) searchInputEl.value = '';
      const clearBtnEl = document.getElementById('search-clear-btn');
      if (clearBtnEl) clearBtnEl.classList.remove('show');
      filtersCleared = true;
    }
    if (filtersCleared) renderFeed();

    let row = document.getElementById('row-' + key);
    if (!row) {
      const existsInFeed = feedState.posts.some(function (p) { return p.id === postId; });
      if (!existsInFeed) {
        try {
          const res = await callApi('getPostById', { postId: postId });
          if (res.ok && res.post) {
            feedState.posts.unshift(res.post);
            renderFeed();
          } else {
            return;
          }
        } catch (e) {
          return;
        }
      }
      row = document.getElementById('row-' + key);
      if (!row) return;
    }
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1600);
    const st = threadState[key] || (threadState[key] = { open: false, replyOpenFor: null });
    if (!st.open) toggleThread(postId, itemId);
        if (session.role !== '담당') { markThreadSeenLocal(postId, itemId); }
  }, 50);
}

function renderPost(post) {
const items = post.items || [];
const itemsHtml = items.map(item => renderItemRow(post, item)).join('');
const allConfirmed = items.length > 0 && items.every(function (item) { return item.confirmed; });
return `
<div class="post-card${allConfirmed ? ' all-confirmed' : ''}" id="post-${post.id}">
<div class="post-head">
<div class="bot-icon">✨</div>
<span class="material-badge">${escapeHtml(post.materialName || '')}</span>
<div class="bot-name">AI 시황봇</div>
<span class="post-time">${escapeHtml(fmtTime(post.createdAt))}</span>
</div>
<div class="post-title">${escapeHtml(post.summary || '')}</div>
<div class="post-summary">${escapeHtml(post.title || '')}</div>
${post.link ? `<a class="article-link" href="${escapeHtml(post.link)}" target="_blank" rel="noopener">🔗 기사 원문 보기</a>` : ''}
<div class="items-box">
<div class="items-box-head">📊 이 원자재를 쓰는 품목 ${items.length}건 · 확인 ${post.confirmedCount || 0}/${post.totalCount || items.length}</div>
${itemsHtml}
</div>
</div>
`;
}

function renderItemRow(post, item) {
  const checked = !!item.confirmed;
  const key = post.id + '-' + item.itemId;
  return `
    <div>
      <div class="item-row ${checked ? 'checked' : 'unchecked'}" id="row-${key}" onclick="toggleThread('${post.id}', '${item.itemId}')">
        <div class="customer">${escapeHtml(item.customer || '')}</div>
        <div>${escapeHtml(item.itemName || '')}</div>
        <div class="status ${checked ? 'checked' : 'unchecked'}">
          <span class="status-dot">${checked ? '✓' : '○'}</span>
          <span>${escapeHtml(item.manager || '')}</span>
        </div>
      </div>
      <div class="comment-thread" id="thread-${key}"></div>
    </div>
  `;
}

async function toggleThread(postId, itemId) {
  const key = postId + '-' + itemId;
  const panel = document.getElementById('thread-' + key);
  const st = threadState[key] || (threadState[key] = { open: false, replyOpenFor: null });
  const item = findItem(postId, itemId);

  st.open = !st.open;
  panel.classList.toggle('open', st.open);
  if (!st.open) return;

    if (session.role !== '담당') { markThreadSeenLocal(postId, itemId); }

  if (item && !item.confirmed) {
    renderThread(postId, itemId);
    return;
  }

  const pc = postComments[postId];
  if (!pc || !pc.loaded) {
    panel.innerHTML = `<div class="thread-empty">댓글 불러오는 중...</div>`;
    await loadComments(postId);
  }
  renderThread(postId, itemId);
}

function findItem(postId, itemId) {
  const post = findPost(postId);
  if (!post) return null;
  for (const item of (post.items || [])) {
    if (String(item.itemId) === String(itemId)) return item;
  }
  return null;
}

function findPost(postId) {
  return feedState.posts.find(p => String(p.id) === String(postId));
}

async function loadComments(postId) {
  try {
    const res = await callApi('getComments', { postId });
    if (!res.ok) {
      postComments[postId] = { loaded: true, comments: [], error: res.error };
      return;
    }
    postComments[postId] = { loaded: true, comments: res.comments || [] };
  } catch (e) {
    postComments[postId] = { loaded: true, comments: [], error: 'NETWORK_ERROR' };
  }
}

function canStartFirstComment(item) {
  if (!session || !item) return false;
  return session.role === '담당' && String(item.manager || '').trim() === String(session.name || '').trim();
}
function canReply() {
  return session && (session.role === '담당' || session.role === '팀장' || session.role === '임원');
}
function roleClass(role) {
  if (role === '담당') return 'role-담당';
  if (role === '팀장') return 'role-팀장';
  if (role === '임원') return 'role-임원';
  return 'role-담당';
}

function renderThread(postId, itemId) {
  const key = postId + '-' + itemId;
  const panel = document.getElementById('thread-' + key);
  const item = findItem(postId, itemId);
  const pc = postComments[postId] || { comments: [] };
  const comments = (pc.comments || []).filter(c => String(c.itemId) === String(itemId));

  if (pc.error) {
    panel.innerHTML = `<div class="thread-error">댓글을 불러오지 못했어요. (${escapeHtml(pc.error)})</div>`;
    return;
  }

  if (!comments.length) {
    const startBtn = canStartFirstComment(item)
      ? `<button class="first-comment-btn" onclick="openReplyBox('${postId}', '${itemId}', null)">첫 댓글 남기기</button>
         <div id="composer-${key}-root" class="first-comment-form"></div>`
      : '';
    panel.innerHTML = `<div class="thread-empty">아직 확인 댓글이 없어요.</div>${startBtn}`;
    return;
  }

  const byId = {}; comments.forEach(c => byId[c.commentId] = c);
  function depthOf(c) {
    let d = 0, cur = c;
    while (cur && cur.parentCommentId && byId[cur.parentCommentId]) { d++; cur = byId[cur.parentCommentId]; if (d > 8) break; }
    return d;
  }

  const html = comments.map(c => {
    const depth = depthOf(c);
    const parent = c.parentCommentId ? byId[c.parentCommentId] : null;
    const isMine = !!(session && session.email && c.authorEmail && String(c.authorEmail).toLowerCase() === String(session.email).toLowerCase());
    const replyBtn = canReply()
      ? `<button class="comment-reply-btn" onclick="openReplyBox('${postId}', '${itemId}', '${c.commentId}')">답장</button>`
      : '';
    const editBtn = isMine
      ? `<button class="comment-edit-btn" onclick="startEditComment('${postId}', '${itemId}', '${c.commentId}')">수정</button>`
      : '';
    const deleteBtn = isMine
      ? `<button class="comment-delete-btn" onclick="deleteCommentConfirm('${postId}', '${itemId}', '${c.commentId}')">삭제</button>`
      : '';
    return `
      <div class="comment-item${c.pending ? ' pending' : ''}${c.deleting ? ' pending' : ''}" style="margin-left:${depth * 24}px;">
        <div class="avatar ${roleClass(c.authorRole)}">${escapeHtml(initials(c.authorName))}</div>
        <div class="comment-body">
          ${parent ? `<div class="reply-to">↳ ${escapeHtml(parent.authorName)} ${escapeHtml(parent.authorRole || '')}에게 답장</div>` : ''}
          <div class="comment-head">

async function submitComment(postId, itemId, parentCommentId) {
  const key = postId + '-' + itemId;
  const ta = document.getElementById('ta-' + key);
  const btn = document.getElementById('btn-send-' + key);
  const content = ta.value.trim();
  if (!content) { ta.focus(); return; }

  btn.disabled = true; btn.textContent = '등록 중...';

  const tempId = 'temp-' + Date.now();
  const optimisticComment = {
    commentId: tempId,
    postId: postId,
    itemId: itemId,
    authorEmail: session.email || '',
    authorName: session.name,
    authorRole: session.role,
    parentCommentId: parentCommentId || '',
    content: content,
    createdAt: new Date().toISOString(),
    pending: true
  };
  if (!postComments[postId]) postComments[postId] = { loaded: true, comments: [] };
  postComments[postId].comments = (postComments[postId].comments || []).concat([optimisticComment]);
  const st = threadState[key];
  st.replyOpenFor = null;
  renderThread(postId, itemId);

  try {
    const res = await callApi('postComment', { postId, itemId, content, parentCommentId });
    if (!res.ok) {
      postComments[postId].comments = postComments[postId].comments.filter(c => c.commentId !== tempId);
      renderThread(postId, itemId);
      alert(res.error === 'FORBIDDEN_VIEWER' ? '이 작업을 수행할 권한이 없어요.' : ('오류가 발생했어요 (' + res.error + ')'));
      btn.disabled = false; btn.textContent = '등록';
      return;
    }

    if (res.comments) {
      postComments[postId] = { loaded: true, comments: res.comments };
    }
    if (res.updatedPost) {
      const idx = feedState.posts.findIndex(p => String(p.id) === String(postId));
      if (idx !== -1) feedState.posts[idx] = res.updatedPost;
    }
        /* v26: 여기서 markThreadSeenLocal을 호출하지 않는다 - 예전에는 댓글 등록 직후 무조건 호출해서, 팀장/임원이 남긴 답변이 만든 '답변 요청' 상태가 등록과 동시에 사라지는 문제가 있었다(hasAwaitingReply 참고). '댓글 필요'(hasUnreadReply)는 이 호출이 없어도 문제없다 - 방금 내가 마지막 댓글 작성자가 됐으므로 그 함수 안에서 이미 자동으로 꺼진다. 스레드 '확인' 처리는 실제로 스레드를 열어보는 시점(toggleThread, 알림 클릭 이동)에만 한다. */
        renderFeed();
    updateNotifBadge();

    renderThread(postId, itemId);
    const panel = document.getElementById('thread-' + key);
    if (panel) panel.classList.add('open');
    if (threadState[key]) threadState[key].open = true;
  } catch (e) {
    if (postComments[postId]) {
      postComments[postId].comments = postComments[postId].comments.filter(c => c.commentId !== tempId);
      renderThread(postId, itemId);
    }
    alert('네트워크 오류로 등록하지 못했어요.');
    btn.disabled = false; btn.textContent = '등록';
  }
}

async function loadThreadSeenMap() {
// getThreadSeen은 RETRYABLE_API_ACTIONS에 있어서 callApi()가 네트워크 예외(타임아웃 등)에 대해
// 이미 내부적으로 최대 3회(회당 20초)까지 재시도한다. 여기서 그 위에 또 3회를 겹쳐 재시도하면
// 최악의 경우 3x3=9번, 최대 3분 가까이 걸릴 수 있어서(실제로 로그에서 확인됨) 네트워크 예외는
// 여기서 다시 재시도하지 않는다. 대신 "응답은 왔지만 ok:false/seenMap 없음"처럼 callApi가
// 재시도 대상으로 보지 않는 실패만 여기서 재시도한다(이건 보통 빠르게 응답이 오는 경우라 재시도 비용이 적다).
for (let attempt = 0; attempt < 3; attempt++) {
try {
const res = await callApi('getThreadSeen', {});
if (res.ok && res.seenMap) {
threadSeenMap = res.seenMap;
threadSeenMapLoaded = true;
return;
}
} catch (e) {
// callApi가 이미 네트워크 예외에 대해 재시도를 다 해본 뒤 던진 것이므로, 여기서 또
// 700ms~2.1초씩 기다리며 재시도하지 않고 바로 포기한다.
return;
}
if (attempt < 2) await new Promise(function (resolve) { setTimeout(resolve, 700 * (attempt + 1)); });
}
// 3회 재시도에도 실패하면 threadSeenMapLoaded는 false로 남는다.
// 이 경우 hasUnreadReply/hasAwaitingReply가 "읽음 기록 없음 [EQ] 안읽음"으로 오판하지 않도록 안전하게 처리한다.
}

function hasUnreadReply(postId, item) {
if (!threadSeenMapLoaded) return false;
const comments = item.comments || [];
if (!comments.length) return false;
const isOverseer = session.role === '팀장' || session.role === '임원' || session.email === ADMIN_EMAIL;
const participant = comments.some(function (c) { return c.authorEmail === session.email; });
if (!isOverseer && !participant) return false;
const sorted = comments.slice().sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
const last = sorted[sorted.length - 1];
if (last.authorEmail === session.email) return false;
const key = postId + '-' + item.itemId;
const seenAt = threadSeenMap[key];
if (!seenAt) return true;
return new Date(last.createdAt) > new Date(seenAt);
}

function hasAwaitingReply(postId, item) {
if (!threadSeenMapLoaded) return false; if (session.role !== '팀장' && session.role !== '임원') return false; const comments = item.comments || []; if (!comments.length) return false; const sorted = comments.slice().sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); }); const last = sorted[sorted.length - 1]; if (last.authorEmail !== session.email) return false; /* v26: 댓글 등록 시 자동 확인 처리(postComment 성공 핸들러)는 더 이상 호출하지 않으므로, 여기서 seenAt과 비교해도 방금 남긴 답변이 등록과 동시에 사라지는 문제가 재발하지 않는다. 실제로 스레드를 열어봤을 때(toggleThread, 알림 클릭 이동)만 seenAt이 갱신되어 답변 요청이 사라진다. */ const key = postId + '-' + item.itemId; const seenAt = threadSeenMap[key]; if (!seenAt) return true; return new Date(last.createdAt) > new Date(seenAt); 
}

function markThreadSeenLocal(postId, itemId) {
const key = postId + '-' + itemId;
threadSeenMap[key] = new Date().toISOString();
callApi('markThreadSeen', { postId: postId, itemId: itemId }).catch(function () {});
updateNotifBadge();
}

async function loadItems(isRetry) {
const root = document.getElementById('items-view');
// 이미 한번 불러온 적이 있으면(=백그라운드 복귀 등으로 인한 조용한 갱신) 화면을 비우지 않고
// 기존 목록을 그대로 보여준 채 뒤에서 조용히 새로 받아온다. 데이터 신선도(다른 담당자가
// 그 사이 수정했을 수 있음)는 유지하되, 매번 "불러오는 중..." 화면으로 깜빡이며 기다리게
// 하던 문제를 없앤다. 최초 진입(아직 한번도 못 불러온 경우)에는 기존처럼 로딩 화면을 보여준다.
const isFirstLoad = !itemsState.loaded;
if (isFirstLoad) {
root.innerHTML = `<div class="feed-loading"><span class="mro-spinner"></span>불러오는 중...</div>`;
}
// Promise.all 대신 allSettled 사용: 셋 중 하나가 일시적으로 실패해도
// 나머지가 성공했으면 화면은 정상적으로 띄운다 (구글 앱스 스크립트는 동시 요청에
// 가끔 삐끗할 수 있어, 하나의 실패가 전체를 막아버리지 않도록 하기 위함).
const settled = await Promise.allSettled([
callApi('getItems', {}),
callApi('getCustomers', {}),
callApi('getUsers', {})
]);
const itemsRes = settled[0].status === 'fulfilled' ? settled[0].value : { ok: false, error: 'NETWORK_ERROR' };
const customersRes = settled[1].status === 'fulfilled' ? settled[1].value : { ok: false };
const usersRes = settled[2].status === 'fulfilled' ? settled[2].value : { ok: false };
if (!itemsRes.ok) {
  // 백그라운드 복귀 직후 네트워크 준비 지연으로 실패했을 수 있어 한번만 자동 재시도
  if (!isRetry) { setTimeout(function () { loadItems(true); }, 1800); return; }
  // 최초 로딩이 아니라 조용한 갱신 중 실패한 거라면, 이미 보여주고 있던 목록을 에러 화면으로
  // 덮어쓰지 않고 그대로 유지한다 (다음 갱신 때 다시 시도됨).
  if (isFirstLoad) {
    root.innerHTML = `<div class="feed-empty">품목 목록을 불러오지 못했어요. (${escapeHtml(itemsRes.error || 'SERVER_ERROR')})</div>`;
  }
  return;
}
itemsState.items = itemsRes.items || [];
itemsState.customers = customersRes.ok ? (customersRes.customers || []) : [];
itemsState.teamUsers = usersRes.ok ? (usersRes.users || []).filter(function (u) { return u.team === session.team && u.status === '활성' && u.role === '담당'; }) : [];
if (!itemsState.loaded) {
itemsState.filterTeam = session.team || '';
}
itemsState.loaded = true;
// 응답을 기다리는 사이 사용자가 이미 다른 탭으로 이동했을 수 있다. 이때 items-view는 display:none이라
// scrollWidth 등 폭 계산이 전부 0으로 나와 상단 스크롤바 폭이 0px로 잘못 확정되는 문제가 실측으로 확인됨.
// 화면이 실제로 보이는 상태일 때만 다시 그린다.
if (currentView === 'items') {
renderItemsView();
}
}

} catch (e) {
} finally {
if (btn) { btn.disabled = false; btn.textContent = btnOrigText; }
}
}

function onCustomerInput() {
const input = document.getElementById('item-customer-input');
const q = input.value.trim();
const box = document.getElementById('customer-suggestions');
if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
const matches = itemsState.customers.filter(function (c) { return c.name.toLowerCase().includes(q.toLowerCase()); }).slice(0, 8);
const exact = itemsState.customers.some(function (c) { return c.name === q; });
let html = matches.map(function (c) {
return `<div class="customer-suggestion-item" onmousedown="selectCustomer('${escapeHtml(c.name).replace(/'/g, "\\'")}')">${escapeHtml(c.name)}</div>`;
}).join('');
if (!exact) {
html += `<div class="customer-suggestion-item add-new" onmousedown="addNewCustomer()">+ "${escapeHtml(q)}" 새 고객사로 추가</div>`;
}
box.innerHTML = html;
box.style.display = 'block';
}

function selectCustomer(name) {
document.getElementById('item-customer-input').value = name;
document.getElementById('customer-suggestions').style.display = 'none';
}

async function addNewCustomer() {
const input = document.getElementById('item-customer-input');
const q = input.value.trim();
if (!q) return;
try {
const res = await callApi('upsertCustomer', { name: q });
if (res.ok) {
itemsState.customers.push({ code: res.code, name: res.name, manager: '' });
selectCustomer(res.name);
} else {
alert('고객사 추가 실패: ' + (res.error || 'SERVER_ERROR'));
}
} catch (e) {
alert('네트워크 오류가 발생했어요.');
}
}

async function saveItemForm() {
if (!canEditItems()) return; // 방어: 뷰어 권한(담당)에서는 저장 버튼 자체가 없지만 이중 방어
const customer = document.getElementById('item-customer-input').value.trim();
const itemName = document.getElementById('item-name-input').value.trim();
const manager = document.getElementById('item-manager-select').value;
const status = document.querySelector('input[name="item-status"]:checked').value;
if (!customer || !itemName || !manager) {
alert('고객사, 품목명, 담당을 모두 입력해주세요.');
return;
}
const payload = {
itemId: itemsState.editingItemId || '',
customer: customer,
itemName: itemName,
manager: manager,
materials: itemsState.selectedMaterials.join(','),
status: status
};
const btn = document.getElementById('item-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  try {
const res = await callApi('upsertItem', payload);
if (!res.ok) {
alert('저장 실패: ' + (res.error || 'SERVER_ERROR'));
if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  return;
}
closeItemForm();
await loadItems();
} catch (e) {
alert('네트워크 오류가 발생했어요.');
if (btn) { btn.disabled = false; btn.textContent = '저장'; }
  }
}

function doLogout() {
  localStorage.removeItem('mro_session');
  clearIdleTracking();
  window.location.href = 'index.html';
}
</script>
</body>
